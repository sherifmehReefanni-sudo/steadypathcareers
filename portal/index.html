<link rel="stylesheet" href="../assets/site.css?v=20261023a">
<style>
/* ---- portal tokens ---- */
:root { --yes: #1f7a46; --yes-bg: #edf8f1; --yes-line: #9fd3b2; --q: #8a6400; --q-bg: #fff6df; --q-line: #e6c66d; --no-bg: #f2f2ef; --no-line: #d6d6d0; --no-ink: #5f6470; --tabh: 64px; }
body { overflow-x: hidden; }
.pmain { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.pmain.wide { max-width: 1100px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- header ---- */
.sky { overflow: visible; }
.ptop { display: flex; align-items: center; gap: 10px; padding: 12px 0; min-height: 60px; }
.ptop .brand { font-size: 16px; min-width: 0; }
.ptop .brand svg { width: 32px; height: 32px; flex: none; }
.ptop .brand .bname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-badge { background: var(--dawn); color: var(--midnight); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 3px 10px; letter-spacing: .03em; flex: none; }
.ptabs { display: flex; gap: 2px; margin-left: 10px; }
.ptabs button { border: 0; background: transparent; color: #d7e0ee; padding: 9px 14px; border-radius: 9px; font-weight: 800; font-size: 15px; display: inline-flex; gap: 7px; align-items: center; min-height: 44px; }
.ptabs button svg { width: 18px; height: 18px; }
.ptabs button[aria-current="true"] { background: rgba(251,246,238,.14); color: #fff; }
.ptabs .cnt, .tabbar .cnt { background: var(--gold); color: var(--midnight); border-radius: 99px; font-size: 11.5px; font-weight: 800; padding: 1px 7px; line-height: 1.5; }
.acct { margin-left: auto; position: relative; flex: none; }
.acct > button { border: 0; background: rgba(251,246,238,.12); color: var(--cream); border-radius: 99px; min-height: 44px; padding: 6px 12px 6px 6px; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.acct .av { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--midnight); display: grid; place-items: center; font-weight: 800; }
.acct .menu { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; color: var(--ink); border-radius: 14px; box-shadow: 0 16px 40px rgba(16,33,58,.25); padding: 6px; min-width: 200px; z-index: 30; display: grid; }
.acct .menu button { border: 0; background: transparent; text-align: left; padding: 12px 14px; min-height: 44px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--navy); }
.acct .menu button:hover { background: var(--sunk); }
.ptitle { padding: 2px 0 18px; }
.ptitle h1 { font: 800 clamp(24px, 3.6vw, 34px)/1.1 var(--display); letter-spacing: -0.02em; margin: 0; color: var(--cream); }
.ptitle p { margin: 4px 0 0; color: #d7e0ee; font-size: 15px; }
.sky svg.scene { margin-top: -6px; }

/* ---- bottom tab bar (phones) ---- */
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(16,33,58,.08); padding: 4px max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tabbar nav { display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { border: 0; background: transparent; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-weight: 800; font-size: 13px; position: relative; border-radius: 12px; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-current="true"] { color: var(--navy); }
.tabbar button[aria-current="true"]::before { content: ""; position: absolute; top: 0; width: 36px; height: 3px; border-radius: 3px; background: var(--gold); }
.tabbar .cnt { position: absolute; top: 4px; left: calc(50% + 8px); }

/* ---- top of Jobs ---- */
.hello { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hello b { font-size: 20px; color: var(--navy); }
.hello span { color: var(--muted); font-size: 14px; font-weight: 700; }
.prog { display: grid; gap: 6px; }
.prog .lbl { font-weight: 800; font-size: 16px; color: var(--ink); }
.prog .bar { height: 8px; border-radius: 99px; background: #e7e1d3; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
.nextc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--navy); color: var(--cream); border-radius: 16px; padding: 14px 16px; }
.nextc small { display: block; color: var(--dawn); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.nextc b { display: block; font-size: 17px; line-height: 1.25; }
.nextc span { display: block; color: #d7e0ee; font-size: 14px; margin-top: 2px; }
.nextc .btn { min-height: 44px; }
.wnote { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.wnote .av { width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: var(--dawn); display: grid; place-items: center; font-weight: 800; }
.wnote .from { font-size: 13px; color: var(--muted); font-weight: 700; }
.wnote p { margin: 2px 0 0; font: italic 500 17px/1.4 var(--serif); color: var(--ink); }
.wnote.clamp p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wnote .more { border: 0; background: none; padding: 6px 0 0; min-height: 32px; color: var(--navy); font-weight: 800; font-size: 14px; text-decoration: underline; }
.fbask { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.fbask p { margin: 0; font-weight: 700; }
.a2hs { background: linear-gradient(135deg, var(--midnight), var(--navy)); color: var(--cream); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; }
.a2hs .ic svg { width: 30px; height: 30px; }
.a2hs b { color: var(--dawn); }
.a2hs p { margin: 2px 0 0; font-size: 14px; color: #d7e0ee; }
.a2hs .row { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.a2hs .row .btn.ghost { background: transparent; color: var(--cream); border-color: rgba(251,246,238,.45); }
.sec-h { font: 800 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }

/* ---- job cards ---- */
.jlist { display: flex; flex-direction: column; gap: 14px; }
.jc { position: relative; background: #fff; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: pan-y; box-shadow: 0 2px 10px rgba(16,33,58,.05); }
.jc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--navy); }
.jc .in { padding: 16px 16px 14px 22px; display: flex; flex-direction: column; gap: 10px; }
.jc .jst { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.jc .jst svg { width: 22px; height: 22px; flex: none; }
.jc .ttl { font: 800 21px/1.2 var(--display); letter-spacing: -0.015em; color: var(--navy); margin: 0; }
.jc .pay { font: 800 22px/1.15 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.jc .pay small { display: inline-block; font: 700 13px var(--display); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.jc .pay.est { font-size: 18px; color: #6f5300; }
.jc .where { color: var(--muted); font-size: 15.5px; font-weight: 600; }
.jc .pills { display: flex; flex-wrap: wrap; gap: 6px; }
.jc .ans3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 14px 22px; border-top: 1px solid rgba(0,0,0,.06); background: rgba(255,255,255,.6); }
.jc .ans3 button { min-height: 48px; border-radius: 12px; border: 2px solid #cfd6e3; background: #fff; font-weight: 800; font-size: 16px; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; }
.jc .ans3 button svg { width: 18px; height: 18px; flex: none; }
.jc .ans3 button.yes[aria-pressed="true"] { background: var(--yes); border-color: var(--yes); color: #fff; }
.jc .ans3 button.q[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--midnight); }
.jc .ans3 button.no[aria-pressed="true"] { background: var(--no-ink); border-color: var(--no-ink); color: #fff; }
.jc .ans3 button[disabled] { opacity: .6; cursor: wait; }
.jc .dtog { align-self: flex-start; border: 0; background: none; padding: 6px 0; min-height: 40px; font-weight: 800; font-size: 15px; color: var(--navy); display: inline-flex; gap: 6px; align-items: center; }
.jc .dtog svg { width: 16px; height: 16px; transition: transform .15s; }
.jc .dtog[aria-expanded="true"] svg { transform: rotate(180deg); }
.jc .det { display: grid; gap: 10px; padding: 12px 14px; background: rgba(246,237,217,.55); border-radius: 12px; font-size: 15.5px; line-height: 1.5; }
.jc .det p { margin: 0; }
.jc .det .lab { font-weight: 800; color: var(--navy); display: block; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.jc .det .heads { background: var(--gold-soft); border-radius: 10px; padding: 8px 10px; }
.jc .det .dlinks { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0; }
.jc .det .dlinks a, .jc .det .dlinks button { font-weight: 800; color: var(--navy); font-size: 15px; min-height: 36px; display: inline-flex; align-items: center; }
.jc .det .dlinks button { border: 0; background: none; padding: 0; text-decoration: underline; color: var(--muted); }
.jc .note2 { display: grid; gap: 8px; }
.jc .note2 textarea { width: 100%; border: 1.5px solid #d3dae6; border-radius: 12px; padding: 10px 12px; font: 16px var(--display); min-height: 70px; resize: vertical; color: var(--ink); background: #fff; }
.jc .note2 .row { display: flex; gap: 8px; align-items: center; }
.jc .note2 .btn { min-height: 44px; }
.jc .err { color: var(--bad); font-weight: 700; font-size: 14px; margin: 0; }
.jc .saving { color: var(--muted); font-weight: 700; font-size: 14px; }
.jc .nstep { margin: 0; font-weight: 700; font-size: 15px; }
.hint { margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--info-soft); color: var(--info); border-radius: 10px; padding: 6px 6px 6px 12px; font-weight: 800; font-size: 14px; }
.hint button { border: 0; background: none; color: var(--info); min-width: 36px; min-height: 36px; font-size: 20px; line-height: 1; }

/* status colors */
.jc.s-yes { background: var(--yes-bg); border-color: var(--yes-line); }
.jc.s-yes::before { background: var(--yes); }
.jc.s-yes .jst { color: var(--yes); }
.jc.s-q { background: var(--q-bg); border-color: var(--q-line); }
.jc.s-q::before { background: var(--gold); }
.jc.s-q .jst { color: var(--q); }
.jc.s-no { background: var(--no-bg); border-color: var(--no-line); box-shadow: none; }
.jc.s-no::before { background: #c4c4bd; }
.jc.s-no .jst, .jc.s-no .ttl, .jc.s-no .pay, .jc.s-no .where { color: var(--no-ink); }
.jc.s-no .ttl { font-size: 18px; }
.jc.s-no .pay { font-size: 17px; }

/* tracker */
.trk { list-style: none; margin: 2px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
.trk::before { content: ""; position: absolute; top: 9px; left: 10%; right: 10%; height: 3px; background: #cfe5d7; }
.trk::after { content: ""; position: absolute; top: 9px; left: 10%; width: var(--p, 0%); height: 3px; background: var(--yes); }
.trk li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.trk .d { width: 21px; height: 21px; border-radius: 50%; background: #fff; border: 3px solid #b9d9c4; display: grid; place-items: center; z-index: 1; }
.trk .d svg { width: 12px; height: 12px; }
.trk li.done .d { background: var(--yes); border-color: var(--yes); }
.trk li.now .d { background: #fff; border-color: var(--yes); box-shadow: 0 0 0 4px rgba(31,122,70,.2); }
.trk li.now, .trk li.done { color: var(--ink); }
.trk .full { display: inline; }
.trk .short { display: none; }
.trknow { margin: 0; font-size: 15px; font-weight: 800; color: var(--yes); }

/* apply kit */
.kit { background: #fff; border: 1.5px solid var(--yes-line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.kit h3 { margin: 0; font: 800 18px var(--display); color: var(--navy); display: flex; gap: 8px; align-items: center; }
.kit h3 svg { width: 22px; height: 22px; }
.kit .wait { margin: 0; color: var(--muted); font-weight: 700; }
.kit .pdfs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.kbtn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 2px solid var(--navy); background: #fff; color: var(--navy); font-weight: 800; font-size: 15.5px; text-decoration: none; padding: 6px 12px; text-align: center; }
.kbtn svg { width: 20px; height: 20px; flex: none; }
.kbtn.solid { background: var(--navy); color: #fff; }
.kans { display: grid; gap: 8px; }
.kans .a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; background: var(--sunk); border-radius: 12px; padding: 10px 10px 10px 12px; }
.kans .a b { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kans .a p { margin: 2px 0 0; font-size: 15.5px; }
.kans .a button { border: 2px solid var(--navy); background: #fff; color: var(--navy); border-radius: 10px; min-height: 40px; min-width: 64px; font-weight: 800; font-size: 14px; }
.kcheck { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: k; }
.kcheck label { display: flex; align-items: center; gap: 12px; min-height: 44px; font-weight: 700; font-size: 15.5px; cursor: pointer; }
.kcheck input { width: 24px; height: 24px; accent-color: var(--yes); }
.kcheck input:checked + span { color: var(--muted); text-decoration: line-through; }
.kdone { min-height: 52px; width: 100%; border: 0; border-radius: 14px; background: var(--yes); color: #fff; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.kdone svg { width: 22px; height: 22px; }
.kdone[disabled] { opacity: .6; cursor: wait; }
.kapplied { margin: 0; font-weight: 800; color: var(--yes); }

/* passed section */
.passed { border-top: 1px dashed #d0cbbd; padding-top: 6px; }
.passed > button { width: 100%; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 4px; font-weight: 800; font-size: 16px; color: var(--no-ink); }
.passed > button svg { width: 20px; height: 20px; transition: transform .15s; }
.passed > button[aria-expanded="true"] svg { transform: rotate(180deg); }
.passed .jlist { margin-top: 6px; }

/* swipe */
.jc .sl { position: absolute; top: 18px; z-index: 3; font: 800 26px var(--display); letter-spacing: .06em; padding: 4px 14px; border-radius: 10px; border: 3px solid; opacity: 0; pointer-events: none; }
.jc .sl.y { left: 22px; color: var(--yes); border-color: var(--yes); background: rgba(237,248,241,.92); transform: rotate(-8deg); }
.jc .sl.p { right: 16px; color: var(--no-ink); border-color: var(--no-ink); background: rgba(242,242,239,.92); transform: rotate(8deg); }
.jc.dragging { box-shadow: 0 16px 40px rgba(16,33,58,.2); z-index: 4; }
.jc.spring { transition: transform .25s cubic-bezier(.2,.9,.3,1.2); }
.jc.fly { transition: transform .2s ease-in, opacity .2s ease-in; }
.jc.leave { transition: opacity .2s, transform .2s; opacity: 0; transform: scale(.97); }
@media (prefers-reduced-motion: reduce) { .jc.spring, .jc.fly, .jc.leave { transition: none; } .jc .dtog svg, .passed > button svg { transition: none; } }

/* undo toast */
.toast { bottom: max(84px, calc(env(safe-area-inset-bottom, 0px) + 84px)); font-size: 15px; padding: 12px 20px; max-width: calc(100vw - 32px); }
.toast.undo { display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; white-space: nowrap; }
.toast.undo button { border: 0; background: var(--gold); color: var(--midnight); border-radius: 99px; min-height: 40px; padding: 0 16px; font-weight: 800; font-size: 15px; }

/* documents */
.dgrp { display: grid; gap: 10px; }
.dgrp h2 { margin: 6px 0 0; font: 800 17px var(--display); color: var(--navy); }
.dgrp h2 span { display: block; font-weight: 600; font-size: 14px; color: var(--muted); }
.dc { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.dc.ok { border-color: var(--yes-line); }
.dc.ready { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,.15); }
.dc .top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dc .nm { font-weight: 800; font-size: 17px; color: var(--ink); display: flex; gap: 10px; align-items: center; min-width: 0; }
.dc .nm svg { width: 26px; height: 26px; flex: none; }
.dc .meta { color: var(--muted); font-size: 14px; margin: 0; }
.dc .acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.dc .acts .kbtn.ok { background: var(--yes); border-color: var(--yes); color: #fff; }
.dc .notebox { display: grid; gap: 8px; }
.dc .notebox textarea { width: 100%; border: 1.5px solid #d3dae6; border-radius: 12px; padding: 10px 12px; font: 16px var(--display); min-height: 80px; }
.dc .notebox button { justify-self: start; min-height: 44px; }

/* applied tab (kept from the old page, tightened) */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--sunk); border-radius: 14px; padding: 12px; min-width: 0; }
.col h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; cursor: pointer; user-select: none; min-height: 32px; align-items: center; }
.col h3 .tw { transition: transform .15s; display: inline-block; margin-right: 6px; color: var(--gold); }
.col.closed h3 .tw { transform: rotate(-90deg); }
.col.closed .app, .col.closed > p { display: none; }
.app { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 10px; }
.app b { color: var(--navy); font-size: 16px; }
.logbox { display: grid; gap: 6px; margin-bottom: 4px; }
.logbox label { font-weight: 700; font-size: 14px; color: var(--ink); margin-top: 6px; }
.logbox input, .logbox select { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid #cfd6e3; border-radius: 10px; font: inherit; background: #fff; min-height: 44px; }
.logbox .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.linkbtn { border: 0; background: transparent; padding: 0; color: var(--navy); font-weight: 700; text-decoration: underline; cursor: pointer; font: inherit; font-size: 14px; min-height: 36px; }
.flipbox { margin-top: 10px; }
.flip { border: 2px solid var(--navy); border-radius: 14px; padding: 18px; min-height: 140px; background: #fff; cursor: pointer; display: grid; align-content: center; gap: 8px; text-align: center; }
.flip.back { background: var(--navy); color: var(--cream); }
.flip small { color: var(--muted); }
.flip.back small { color: #d7e0ee; }
.fliprow { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
.fliprow .btn { min-height: 44px; }

/* feedback + sign in bits (kept) */
.fbq { display: grid; gap: 10px; }
.fbq + .fbq { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.fbq label, .fbq .lab { font-weight: 800; color: var(--navy); }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale button { min-width: 44px; min-height: 44px; padding: 9px 10px; border-radius: 10px; border: 2px solid #cfd6e3; background: #fff; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }

/* ---- API ---- */
function get(params) { if (S.demo) return demoApi(params); var u = API + '?' + new URLSearchParams(params).toString(); return fetch(u, { redirect: 'follow' }).then(function (r) { return r.json(); }); }

  if (!S.token) { S.status = 'signin'; render(); return; }

  var j = S.data.jobs.filter(function (x) { return x.id === jobId; })[0]; if (!j) return;
  /* Show the choice right away (card color changes), then confirm once the sheet has it. */
  var before = { answer: j.answer, note: j.note };
  j.answer = a ? ANS_WORD[a] : ''; S.pending[jobId] = true; S.justSaved = null; if (S.errJob === jobId) { S.errJob = null; S.err = ''; } render();
  post({ action: 'answer', t: S.token, job: jobId, a: a, note: note }).then(function (d) {
    delete S.pending[jobId];
    if (d.ok) { j.answer = d.answer; j.answeredOn = todayISO(); if (note !== undefined) j.note = note; S.justSaved = jobId; if (!quiet) { if (note !== undefined) SP.toast('Sent. Sherif can see it now.'); else if (a === 'no') undoToast(ANS_TOAST.no, undoTo(jobId, before.answer)); else SP.toast(d.answer ? ANS_TOAST[a] || 'Saved.' : 'Answer cleared.'); } }

  return shell('docs', n ? n + (n === 1 ? ' document needs' : ' documents need') + ' your OK' : 'Your documents', 'Open, approve or ask for changes.') +
    '<main class="pmain">' + (d.docs.length ? groups.map(function (g) {
      return '<section class="dgrp"><h2>' + (g.job ? esc(g.job.title) + '<span>' + esc(g.job.company) + '</span>' : g.k ? 'For job ' + esc(g.k) : 'General') + '</h2>' + g.docs.map(docCard).join('') + '</section>';
    }).join('') : '<div class="card"><p class="psub" style="margin:0">Your resume draft will show up here for your OK.</p></div>') + '</main>' + tabbar('docs');
}
function isReady(x) { var st = String(x.status || ''); return /ready|review/i.test(st) && !/approved/i.test(st); }
function docCard(x) {
  var st = String(x.status || ''), ok = /approved/i.test(st), ready = isReady(x), link = safeUrl(x.link), id = esc(x.id);
  var pillCls = ok ? 'ok' : /changes/i.test(st) ? 'gold' : ready ? 'gold' : 'info';
  return '<div class="dc' + (ok ? ' ok' : ready ? ' ready' : '') + '" data-doc="' + id + '"><div class="top"><div class="nm">' + IC.docs + '<span>' + esc(x.name) + '</span></div><span class="pill ' + pillCls + '">' + (ok ? '&#10003; ' : '') + esc(st || 'In progress') + '</span></div>' +
    (x.updated ? '<p class="meta">Updated ' + esc(fmtDate(x.updated)) + '</p>' : '') + (x.request ? '<p class="meta">Your note: ' + esc(x.request) + '</p>' : '') +
    '<div class="acts">' + (link ? '<a class="kbtn" href="' + esc(link) + '" target="_blank" rel="noopener">' + IC.ext + 'Open</a>' : '') +
    (ready ? '<button class="kbtn ok" data-approve="' + id + '">' + IC.check + 'Approve</button><button class="kbtn" data-changes="' + id + '">Ask for changes</button>' : '') + '</div>' +
    (S.changesFor === x.id ? '<div class="notebox"><label class="sr" for="changesText">What should change?</label><textarea placeholder="What should change?" id="changesText"></textarea><button class="btn" data-sendchanges="' + id + '">Send</button></div>' : '') + '</div>';
}

/* ---- applied ---- */
function stageOf(x) { var t = String(x.status || '').toLowerCase(); if (/offer|hired|accepted/.test(t)) return 3; if (x.interview || /interview/.test(t)) return 2; if (/reply|heard|screen|call|contact/.test(t)) return 1; if (/reject|declin|closed|no longer|withdr/.test(t)) return 3; return 0; }
function lines(t) { return String(t || '').split(/\n|;|(?:\s\d+\.\s)/).map(function (z) { return z.trim(); }).filter(String); }
var APP_STATUS = ['Applied', 'Heard back', 'Interview scheduled', 'Offer', 'Declined', 'Withdrew'];
function logForm() {
  if (!S.logOpen) return '<p style="margin:0"><button class="btn gold" data-logopen>+ Log an application</button></p>' + (S.logMsg ? '<p class="psub" role="status" style="margin:0">' + esc(S.logMsg) + '</p>' : '');
  var iso = todayISO();
  return '<div class="card logbox"><h3>Log an application</h3><p class="psub" style="margin:0">Applied on your own? Add it here.</p>' +
    '<label for="lgCompany">Company</label><input id="lgCompany" maxlength="120" autocomplete="off">' +
    '<label for="lgRole">Job title</label><input id="lgRole" maxlength="160" autocomplete="off">' +
    '<div class="two"><div><label for="lgDate">Date applied</label><input id="lgDate" type="date" value="' + iso + '"></div><div><label for="lgStatus">Where it stands</label><select id="lgStatus">' + APP_STATUS.map(function (o) { return '<option>' + o + '</option>'; }).join('') + '</select></div></div>' +
    '<label for="lgIv">Interview date (if any)</label><input id="lgIv" type="date">' +
    (S.logErr ? '<div class="warn" style="margin-top:10px">' + esc(S.logErr) + '</div>' : '') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn gold" data-logsave ' + (S.logBusy ? 'disabled' : '') + '>' + (S.logBusy ? 'Saving…' : 'Save') + '</button><button class="btn ghost" data-logclose>Cancel</button></div></div>';
}
function saveApp(body, done) {
  post(Object.assign({ action: 'app', t: S.token }, body)).then(function (r) { done(r && r.ok ? r : { ok: false, error: (r && r.error) || 'error' }); }).catch(function () { done({ ok: false, error: 'network' }); });
}
function vApps() {
  var d = S.data, cols = ['Applied', 'Heard back', 'Interview', 'Offer or closed'], by = [[], [], [], []];
  d.apps.forEach(function (x) { by[stageOf(x)].push(x); });
  var prepApp = S.prep ? d.apps.filter(function (x) { return x.id === S.prep; })[0] : null;
  var practice = '';
  if (prepApp) {
    var qs = lines(prepApp.prepExpect); var i = Math.min(S.card || 0, Math.max(qs.length - 1, 0));
    practice = '<div class="card"><h3>Practice: ' + esc(prepApp.company) + '</h3>' + (qs.length ? '<p class="psub" style="margin:0">Answer out loud, then tap the card.</p><div class="flipbox"><div class="flip' + (S.flipped ? ' back' : '') + '" data-flip role="button" tabindex="0" aria-label="Flip card">' +
      (S.flipped ? '<small>Bring up</small><div>' + esc(prepApp.prepBring || 'Use a real example with a number in it.') + '</div>' : '<small>Question ' + (i + 1) + ' of ' + qs.length + '</small><div style="font-weight:800;font-size:19px">' + esc(qs[i]) + '</div>') +
      '</div><div class="fliprow"><button class="btn ghost" data-card="-1"' + (i ? '' : ' disabled') + '>Back</button><button class="btn" data-card="1"' + (i < qs.length - 1 ? '' : ' disabled') + '>Next</button></div></div>' : '<p class="psub">Questions show up here once your prep sheet is ready.</p>') +
      (prepApp.prepAsk ? '<p style="margin:12px 0 0"><b>Ask them:</b> ' + esc(prepApp.prepAsk) + '</p>' : '') + '<p style="margin:12px 0 0"><button class="btn ghost" data-prep="">Close practice</button></p></div>';
  }
  var mob = false; try { mob = matchMedia('(max-width: 760px)').matches; } catch (e) {}
  if (!S.colOpen) { S.colOpen = {}; cols.forEach(function (c, k) { S.colOpen[k] = mob ? by[k].length > 0 && by[k].length <= 6 : true; }); }
  return shell('apps', d.apps.length ? d.apps.length + ' sent so far' : 'Nothing sent yet', 'Where each one stands.') +
    '<main class="pmain wide">' + practice + logForm() + (d.apps.length ? '<div class="board">' + cols.map(function (c, k) {
      return '<div class="col' + (S.colOpen[k] ? '' : ' closed') + '"><h3 data-col="' + k + '" role="button" tabindex="0" aria-expanded="' + !!S.colOpen[k] + '"><span><span class="tw" aria-hidden="true">▾</span>' + c + '</span><span>' + by[k].length + '</span></h3>' + by[k].map(function (x) {
        var hasPrep = x.prepBring || x.prepExpect || x.prepAsk;
        return '<div class="app" data-app="' + esc(x.id) + '"><b>' + esc(x.company) + '</b><div class="psub">' + esc(x.role) + '</div><div class="psub" style="margin-top:4px">Applied ' + esc(fmtDate(x.applied)) + (x.status ? ' · ' + esc(x.status) : '') + '</div>' +
          (x.interview ? '<div style="margin-top:6px"><span class="pill info">Interview ' + esc(fmtDate(x.interview)) + '</span></div>' : '') + (String(x.followUpDue).toLowerCase() === 'yes' ? '<div style="margin-top:6px"><span class="pill gold">Follow-up due</span></div>' : '') +
          (hasPrep ? '<p style="margin:8px 0 0"><button class="btn" data-prep="' + esc(x.id) + '">Interview practice</button></p>' : '') +
          (S.updFor === x.id ? '<div class="logbox" style="margin-top:8px"><label for="upStatus">New status</label><select id="upStatus">' + APP_STATUS.map(function (o) { return '<option' + (o === x.status ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select><label for="upIv">Interview date (if any)</label><input id="upIv" type="date" value="' + esc(x.interview || '') + '"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-upsave="' + esc(x.id) + '">Save</button><button class="btn ghost" data-upd="">Cancel</button></div></div>'
            : '<p style="margin:8px 0 0"><button class="linkbtn" data-upd="' + esc(x.id) + '">Update</button></p>') + '</div>';
      }).join('') + '</div>';
    }).join('') + '</div>' : '<div class="card"><p class="psub" style="margin:0">Say Yes to a job, approve your documents, and apply. It shows up here.</p></div>') + '</main>' + tabbar('apps');
}

function render() {
  var app = $('#app');
  if (S.status === 'signin') { app.innerHTML = vSignin(); return; }
  if (S.status === 'loading' || S.status === 'boot') { app.innerHTML = '<div class="skel">Opening your portal…</div>'; return; }
  if (S.status === 'error') { app.innerHTML = '<div class="pmain"><div class="warn">We couldn\'t reach your portal. Please check your connection and <button class="btn ghost" data-retry>try again</button>.</div></div>'; return; }
  var y = window.scrollY;
  app.innerHTML = ({ jobs: vJobs, docs: vDocs, apps: vApps, feedback: vFeedback }[S.view] || vJobs)();
  window.scrollTo(0, y);
}

function redeemCode(code) {
  var b = $('#codeBtn'); if (b) { b.disabled = true; b.textContent = 'Checking…'; }
  post({ action: 'redeem', email: S.sent, code: code }).then(function (d) {
    if (d.ok && d.t) { S.token = d.t; if (!S.demo) lsSet('sp_token', d.t); S.sent = false; S.codeErr = ''; load(); }
    else { S.codeErr = d.error === 'expired code' ? 'That code has expired. Request a new link below.' : 'That code didn\'t match. Check the newest email and try again.'; render(); }
  }).catch(function () { S.codeErr = 'We couldn\'t check the code. Please check your connection and try again.'; render(); });
}
function copyText(t) {
  var fallback = function () { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); SP.toast(ok ? 'Copied.' : 'Press and hold to copy.'); };
  try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(function () { SP.toast('Copied.'); }, fallback); return; } } catch (e) {}
  fallback();
}
function markApplied(jobId) {
  var j = S.data.jobs.filter(function (x) { return x.id === jobId; })[0]; if (!j || S.applyBusy) return;
  var body = { jobId: j.id, company: j.company, role: j.title, applied: todayISO(), status: 'Applied' };
  S.applyBusy = j.id; render();
  saveApp(body, function (r) {
    S.applyBusy = null;
    if (r.ok) { if (!jobApp(j)) S.data.apps.unshift({ id: r.id, jobId: j.id, company: j.company, role: j.title, applied: body.applied, status: 'Applied', followUpDue: '', interview: '' }); SP.toast('Nice work. It is on your Applied tab.'); }
    else SP.toast(r.error === 'expired' ? 'Your sign-in has expired. Please sign in again.' : 'That didn\'t save. Please try again.');
    render();
  });
}
function scrollToFirst() { var el = document.querySelector('.jc:not(.s-yes):not(.s-q):not(.s-no)'); if (el) el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }
function hideHint() { lsSet('sp_swipehint', '1'); }

/* ---- swipe (touch and pen only; vertical scrolling stays with the browser via touch-action: pan-y) ---- */
var SW = null, blockClickUntil = 0;
function swLabels(card, dx, w) { var p = Math.min(1, Math.abs(dx) / (w * 0.35)); var y = card.querySelector('.sl.y'), n = card.querySelector('.sl.p'); if (y) y.style.opacity = dx > 0 ? p : 0; if (n) n.style.opacity = dx < 0 ? p : 0; }
function swReset(card) { if (!card) return; card.classList.remove('dragging'); if (!REDUCED) { card.classList.add('spring'); setTimeout(function () { card.classList.remove('spring'); }, 300); } card.style.transform = ''; swLabels(card, 0, 1); }
document.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' || !e.isPrimary) return;
  var card = e.target.closest('.jc[data-swipe]'); if (!card || S.pending[card.dataset.jc]) return;
  if (e.target.closest('textarea, input, select, label')) return;
  SW = { card: card, id: card.dataset.jc, x0: e.clientX, y0: e.clientY, dx: 0, mode: null, pid: e.pointerId, w: card.offsetWidth || 1 };
});
document.addEventListener('pointermove', function (e) {
  if (!SW || e.pointerId !== SW.pid) return;
  var dx = e.clientX - SW.x0, dy = e.clientY - SW.y0;
  if (!SW.mode) {
    if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { SW = null; return; }
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 2) { SW.mode = 'h'; SW.card.classList.add('dragging'); try { SW.card.setPointerCapture(SW.pid); } catch (x) {} }
    else return;
  }
  e.preventDefault(); SW.dx = dx;
  SW.card.style.transform = 'translateX(' + dx + 'px) rotate(' + (REDUCED ? 0 : dx / 40) + 'deg)';
  swLabels(SW.card, dx, SW.w);
}, { passive: false });
function swEnd(e, cancelled) {
  if (!SW || (e && e.pointerId !== SW.pid)) return;
  var s = SW; SW = null; if (s.mode !== 'h') return;
  blockClickUntil = Date.now() + 400;
  var j = S.data.jobs.filter(function (x) { return x.id === s.id; })[0];
  var code = s.dx > 0 ? 'yes' : 'no';
  if (cancelled || !j || Math.abs(s.dx) < s.w * 0.35 || ansOf(j) === code) { swReset(s.card); return; }
  var prev = j.answer;
  var go = function () {
    hideHint();
    answer(s.id, code, undefined, true);
    undoToast(code === 'yes' ? 'Saved as Yes.' : 'Saved. Moved to Passed.', undoTo(s.id, prev));
  };
  if (REDUCED) { go(); return; }
  s.card.classList.remove('dragging'); s.card.classList.add('fly');
  s.card.style.transform = 'translateX(' + (s.dx > 0 ? 120 : -120) + '%) rotate(' + (s.dx > 0 ? 8 : -8) + 'deg)'; s.card.style.opacity = '0';
  setTimeout(go, 200);
}
document.addEventListener('pointerup', function (e) { swEnd(e, false); });
document.addEventListener('pointercancel', function (e) { swEnd(e, true); });
document.addEventListener('click', function (e) { if (Date.now() < blockClickUntil && e.target.closest('.jc')) { e.preventDefault(); e.stopPropagation(); } }, true);

document.addEventListener('submit', function (e) {
  if (e.target.id === 'linkForm') { e.preventDefault(); requestLink($('#email').value.trim()); }
  if (e.target.id === 'codeForm') { e.preventDefault(); redeemCode($('#code').value.trim()); }
});
document.addEventListener('change', function (e) {
  var cb = e.target.closest('[data-kc]'); if (!cb) return;
  var c = kitChecks(cb.dataset.kc); c[Number(cb.dataset.i)] = cb.checked; lsSet('sp_kit_' + cb.dataset.kc, JSON.stringify(c));
});
document.addEventListener('click', function (e) {
  var tr = e.target.closest('[data-track]'); if (tr) { track(tr.dataset.track, tr.dataset.job); return; }
  if (S.menu && !e.target.closest('.acct')) { S.menu = false; render(); }
  if (e.target.closest('[data-flip]')) { S.flipped = !S.flipped; render(); return; }
  var ch = e.target.closest('[data-col]'); if (ch) { var ck = ch.dataset.col; S.colOpen[ck] = !S.colOpen[ck]; render(); return; }
  if (e.target.closest('[data-a2hs-go]')) { if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }); } return; }
  if (e.target.closest('[data-a2hs-hide]')) { lsSet('sp_a2hs', String(Date.now())); render(); return; }
  var b = e.target.closest('button'); if (!b) return; var d = b.dataset;
  if (d.menu != null) { S.menu = !S.menu; render(); var m = document.querySelector('.acct .menu button'); if (m) m.focus(); return; }
  if (d.fb) { ['#fbHelp', '#fbChange', '#fbWhy', '#fbQuote'].forEach(function (id, i) { var el = $(id); if (el) S.fbText[['help', 'change', 'why', 'quote'][i]] = el.value; }); var v = /^\d+$/.test(d.v) ? Number(d.v) : d.v; S.fb[d.fb] = S.fb[d.fb] === v ? null : v; render(); return; }
  if (d.fbsubmit != null) { sendFeedback(); return; }
  if (d.prep != null) { S.prep = d.prep || null; S.card = 0; S.flipped = false; render(); if (S.prep) window.scrollTo(0, 0); return; }
  if (d.card) { S.card = (S.card || 0) + Number(d.card); S.flipped = false; render(); return; }
  if (d.go) { S.view = d.go; S.flash = ''; S.menu = false; if (d.go === 'feedback') S.fbDone = false; render(); window.scrollTo(0, 0); return; }
  if (d.first != null) { scrollToFirst(); return; }
  if (d.retry != null) { load(); return; }
  if (d.signout != null) { lsDel('sp_token'); S.token = null; S.data = null; S.status = 'signin'; S.sent = false; S.err = ''; S.menu = false; render(); return; }
  if (d.hidehint != null) { hideHint(); render(); return; }
  if (d.morenote != null) { S.noteOpen = !S.noteOpen; render(); return; }
  if (d.passed != null) { S.passedOpen = !S.passedOpen; render(); return; }
  if (d.det) { S.open[d.det] = !S.open[d.det]; render(); return; }
  if (d.copy != null) { copyText(d.copy); return; }
  if (d.applied) { markApplied(d.applied); return; }
  if (d.ans) { var j = S.data.jobs.filter(function (x) { return x.id === d.j; })[0]; if (!j) return; var cur = ansOf(j);
    hideHint();
    /* Tapping the answer that is already chosen keeps it (it used to clear it, which undid answers when clients tapped twice). */
    if (cur === d.ans) { S.justSaved = d.j; SP.toast('Already saved as ' + ANS_WORD[d.ans] + '.'); render(); return; }
    if (d.ans === 'no' && !REDUCED) { var card = b.closest('.jc'); if (card && card.closest('.passed') == null) { card.classList.add('leave'); setTimeout(function () { answer(d.j, 'no'); }, 200); return; } }
    answer(d.j, d.ans); return; }
  if (d.clear) { answer(d.clear, ''); return; }
  if (d.savenote) { var ta = document.querySelector('[data-note="' + d.savenote + '"]'); S.notes[d.savenote] = ta ? ta.value : ''; answer(d.savenote, d.a, S.notes[d.savenote]); return; }
  if (d.logopen != null) { S.logOpen = true; S.logErr = ''; S.logMsg = ''; render(); var c = $('#lgCompany'); if (c) c.focus(); return; }
  if (d.logclose != null) { S.logOpen = false; S.logErr = ''; render(); return; }
  if (d.logsave != null) {
    var val = function (id) { var el = $(id); return el ? el.value.trim() : ''; };
    var body = { company: val('#lgCompany'), role: val('#lgRole'), applied: val('#lgDate'), status: val('#lgStatus'), interview: val('#lgIv') };
    if (!body.company || !body.role) { S.logErr = 'Please add the company and the job title.'; render(); return; }
    S.logBusy = true; S.logErr = ''; render();
    saveApp(body, function (r) { S.logBusy = false;
      if (r.ok) { S.data.apps.unshift({ id: r.id, company: body.company, role: body.role, applied: body.applied, status: body.status, interview: body.interview }); S.logOpen = false; S.logMsg = 'Saved. ' + body.company + ' is on your board.'; if (body.status === 'Offer') { celebrate(); SP.toast('An offer! Congratulations.'); } }
      else S.logErr = r.error === 'expired' ? 'Your sign-in has expired. Please sign in again, then add it.' : 'Sorry, that didn\'t save. Please check your connection and try again.';
      render(); });
    return;
  }
  if (d.upd != null) { S.updFor = d.upd || null; render(); return; }
  if (d.upsave) { var st = $('#upStatus'), iv = $('#upIv'), id = d.upsave, body2 = { id: id, status: st ? st.value : '', interview: iv ? iv.value : '' };
    saveApp(body2, function (r) { if (r.ok) { S.data.apps.forEach(function (x) { if (x.id === id) { x.status = body2.status; x.interview = body2.interview; } }); S.updFor = null; S.logMsg = 'Updated.'; if (body2.status === 'Offer') { celebrate(); SP.toast('An offer! Congratulations.'); } } else S.logMsg = 'Sorry, that update didn\'t save. Please try again.'; render(); });
    return; }
  if (d.approve) { docStatus(d.approve, 'Approved', ''); return; }
  if (d.changes) { S.changesFor = d.changes; render(); var t0 = $('#changesText'); if (t0) t0.focus(); return; }
  if (d.sendchanges) { var t = $('#changesText'); S.changesFor = null; docStatus(d.sendchanges, 'Changes requested', t ? t.value : ''); return; }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.menu) { S.menu = false; render(); var mb = document.querySelector('[data-menu]'); if (mb) mb.focus(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-flip]')) { e.preventDefault(); S.flipped = !S.flipped; render(); var f = document.querySelector('[data-flip]'); if (f) f.focus(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-col]')) { e.preventDefault(); var ck = e.target.closest('[data-col]').dataset.col; S.colOpen[ck] = !S.colOpen[ck]; render(); }
});
document.addEventListener('input', function (e) { if (e.target.dataset && e.target.dataset.note) S.notes[e.target.dataset.note] = e.target.value; });
load();
</script>
</body>
