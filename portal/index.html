<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your portal · Steady Path Careers</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<meta name="theme-color" content="#10213A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Steady Path">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
.fbq { display: grid; gap: 10px; }
.fbq + .fbq { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.fbq label, .fbq .lab { font-weight: 800; color: var(--navy); }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale button { min-width: 42px; padding: 9px 10px; border-radius: 10px; border: 2px solid #cfd6e3; background: #fff; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
.scale button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--cream); }
.scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); max-width: 520px; }
.fbq textarea { width: 100%; min-height: 84px; padding: 10px 12px; border: 1px solid #cfd6e3; border-radius: 10px; font: inherit; resize: vertical; box-sizing: border-box; }
.fbask { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; padding: 14px 18px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.fbask p { margin: 0; color: var(--ink); min-width: 0; }
.nextcard { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--navy); border-radius: 14px; padding: 14px 18px; }
.nextcard .n { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: var(--cream); display: grid; place-items: center; font-weight: 800; }
.nextcard b { display: block; color: var(--navy); }
.nextcard span { color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--sunk); border-radius: 14px; padding: 12px; min-width: 0; }
.col h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.app { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 10px; }
.app b { color: var(--navy); }
.flipbox { margin-top: 10px; }
.flip { border: 2px solid var(--navy); border-radius: 14px; padding: 18px; min-height: 120px; background: #fff; cursor: pointer; display: grid; align-content: center; gap: 8px; text-align: center; }
.flip.back { background: var(--navy); color: var(--cream); }
.flip small { color: var(--muted); }
.flip.back small { color: #d7e0ee; }
.fliprow { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
.commute { font-weight: 700; }
@media (max-width: 760px) { .board { grid-template-columns: minmax(0, 1fr); } .nextcard { grid-template-columns: 44px minmax(0, 1fr); } .nextcard .btn { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div id="app"><div class="skel">Opening your portal…</div></div>
<script src="../assets/site.js"></script>
<script>
/* Set after the Apps Script web app is deployed. */
var API = 'https://script.google.com/macros/s/AKfycbywIXNDqOMhCuyNx9px8cKGQy4zsuDwxihOF_jMr_jTxv8QOy2OxBrlXC9WffPWZcU/exec';

var S = { token: null, view: 'home', data: null, status: 'boot', err: '', sent: false, pending: {}, notes: {}, fb: {}, fbText: {} };
var $ = function (s) { return document.querySelector(s); };
var esc = SP.esc, fmtDate = SP.fmtDate, daysFrom = SP.daysFrom;

/* ---- token handling ---- */
(function () {
  var q = new URLSearchParams(location.search);
  var t = q.get('t');
  if (t) { try { localStorage.setItem('sp_token', t); } catch (e) {} S.token = t; }
  else { try { S.token = localStorage.getItem('sp_token'); } catch (e) {} }
  if (q.get('expired')) { S.status = 'signin'; S.err = 'That link has expired. Enter your email for a new one.'; try { localStorage.removeItem('sp_token'); } catch (e) {} }
  if (q.get('answered')) S.flash = 'Saved your answer for ' + q.get('answered') + '. Thank you.';
  if (q.get('v')) S.view = q.get('v');
  if (t || q.get('expired') || q.get('answered')) history.replaceState({}, '', location.pathname);
})();

/* ---- API ---- */
function get(params) { var u = API + '?' + new URLSearchParams(params).toString(); return fetch(u, { redirect: 'follow' }).then(function (r) { return r.json(); }); }
function post(body) { return fetch(API, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' }).then(function (r) { return r.json(); }); }
function load() {
  if (!S.token) { S.status = 'signin'; render(); return; }
  S.status = 'loading'; render();
  get({ action: 'me', t: S.token }).then(function (d) {
    if (!d.ok) { S.status = 'signin'; S.err = d.error === 'expired' ? 'Your sign-in link has expired. Enter your email for a new one.' : 'Could not open your portal: ' + d.error; try { localStorage.removeItem('sp_token'); } catch (e) {} S.token = null; render(); return; }
    S.data = d; S.status = 'ready'; render();
  }).catch(function () { S.status = 'error'; render(); });
}
function requestLink(email) {
  var b = $('#linkBtn'); if (b) { b.disabled = true; b.textContent = 'Sending…'; }
  post({ action: 'requestLink', email: email }).then(function () { S.sent = email; S.err = ''; render(); }).catch(function () { S.err = 'Could not send the link. Check your connection and try again.'; render(); });
}
function answer(jobId, a, note) {
  S.pending[jobId] = true; render();
  post({ action: 'answer', t: S.token, job: jobId, a: a, note: note }).then(function (d) {
    delete S.pending[jobId];
    if (d.ok) { var j = S.data.jobs.filter(function (x) { return x.id === jobId; })[0]; if (j) { j.answer = d.answer; j.answeredOn = new Date().toISOString().slice(0, 10); if (note !== undefined) j.note = note; } SP.toast(d.answer ? 'Saved. Sherif can see this now.' : 'Answer cleared'); }
    else { S.errJob = jobId; S.err = d.error === 'expired' ? 'Your session expired. Sign in again.' : 'Not saved: ' + d.error; }
    render();
  }).catch(function () { delete S.pending[jobId]; S.errJob = jobId; S.err = 'Not saved. Check your connection and try again.'; render(); });
}
function docStatus(docId, status, request) {
  post({ action: 'docStatus', t: S.token, doc: docId, status: status, request: request }).then(function (d) {
    if (d.ok) { var x = S.data.docs.filter(function (y) { return y.id === docId; })[0]; if (x) { x.status = status; x.request = request || ''; } SP.toast(status === 'Approved' ? 'Approved. Thank you.' : 'Sent to Sherif.'); }
    else SP.toast('Not saved: ' + d.error);
    render();
  });
}

/* ---- views ---- */
function counts() { var j = (S.data && S.data.jobs) || []; var c = { yes: 0, no: 0, q: 0, wait: 0 }; j.forEach(function (x) { var a = String(x.answer || '').toLowerCase(); if (a.indexOf('yes') === 0) c.yes++; else if (a.indexOf('no') === 0) c.no++; else if (a) c.q++; else c.wait++; }); return c; }
function topbar(active) {
  var items = [['home', 'Home'], ['jobs', 'Job matches'], ['docs', 'Documents'], ['apps', 'Applications']];
  var c = counts();
  return '<div class="wrap"><nav class="topbar"><a class="brand" href="/"><span>' + SP.LOGO + '</span>Steady Path Careers</a><div class="links">' +
    items.map(function (i) { return '<button data-go="' + i[0] + '" aria-current="' + (active === i[0]) + '">' + i[1] + (i[0] === 'jobs' && c.wait ? ' (' + c.wait + ')' : '') + '</button>'; }).join('') +
    '</div><div class="right">' + esc(S.data.client.name) + ' · <button data-signout style="border:0;background:transparent;color:#d7e0ee;font-weight:700;padding:0">Sign out</button></div></nav></div>';
}
function hero(active, kicker, title, text) {
  var d = S.data, c = counts();
  var resumeDoc = (d.docs || []).filter(function (x) { return /resume/i.test(x.name) && !x.jobId; })[0];
  var resumeDone = resumeDoc && /approved/i.test(resumeDoc.status);
  var appsN = (d.apps || []).length;
  var ms = [
    { t: 'Intake', d: 'Done ' + fmtDate(d.client.startDate), s: 'done' },
    { t: 'Resume', d: resumeDone ? 'Approved ' + fmtDate(resumeDoc.updated) : resumeDoc ? 'Waiting for your OK' : 'In review', s: resumeDone ? 'done' : 'now' },
    { t: 'Pick your jobs', d: !d.jobs.length ? 'Coming soon' : c.wait ? c.wait + ' of ' + d.jobs.length + ' waiting' : 'All answered', s: !d.jobs.length ? '' : c.wait ? 'now' : 'done' },
    { t: 'Applications', d: appsN ? appsN + ' submitted' : c.yes ? c.yes + ' in progress' : 'After your first Yes', s: appsN ? 'done' : c.yes ? 'now' : '' },
  ];
  return '<div class="sky">' + topbar(active) + '<div class="wrap"><div class="heroText"><p class="kicker">' + kicker + '</p><h2>' + title + '</h2>' + (text ? '<p>' + text + '</p>' : '') + '</div></div>' + SP.scene(250, active) + '</div>' +
    '<div class="milestones"><div class="wrap">' + ms.map(function (m) { return '<div class="ms ' + m.s + '"><div class="dot"></div><div class="t">' + m.t + '</div><div class="d">' + esc(m.d) + '</div></div>'; }).join('') + '</div></div>';
}
function mobnav(active) { return '<div class="mob-nav">' + [['home', 'Home'], ['jobs', 'Jobs'], ['docs', 'Docs'], ['apps', 'Apps']].map(function (i) { return '<button data-go="' + i[0] + '" aria-current="' + (active === i[0]) + '">' + i[1] + '</button>'; }).join('') + '</div>'; }
function floorPill(f) { f = String(f || '').toLowerCase(); if (f.indexOf('at or above') === 0) return '<span class="pill ok">Meets your floor</span>'; if (f.indexOf('below') === 0) return '<span class="pill bad">Below your floor</span>'; if (!f) return ''; return '<span class="pill gold">Pay not posted</span>'; }
function trialText(c) { var dl = daysFrom(c.trialEnds); if (dl == null) return 'Trial starts with your first jobs'; if (dl < 0) return 'Trial ended ' + fmtDate(c.trialEnds); return dl + ' days left in your trial'; }

function vSignin() {
  return '<div class="login"><div class="say"><a class="brand" href="/"><span>' + SP.LOGO + '</span>Steady Path Careers</a><h1>Your next job, one honest step at a time.</h1><p>Real openings. Posted pay. A person who checked every one.</p><ul><li>Pay shown on every match</li><li>Each posting checked live before it reaches you</li><li>Your resume and cover letter tailored for every Yes</li></ul></div>' +
    '<div class="box"><div><h2>Welcome back</h2><p class="tag">Sign in with your email.</p></div>' +
    (S.sent ? '<div class="sent">Your link is on its way to ' + esc(S.sent) + '. Open it on this device and you\'re in for 30 days.</div><p class="fine">Nothing in your inbox after a few minutes? Check spam, or email hello@steadypathcareers.com.</p>' :
      '<p class="psub">We\'ll send a one-time link. No password to remember.</p>' + (S.err ? '<div class="warn">' + esc(S.err) + '</div>' : '') +
      '<form id="linkForm"><input type="email" id="email" required placeholder="you@example.com" aria-label="Email" autocomplete="email"><button class="btn gold" id="linkBtn" type="submit" style="width:100%;margin-top:10px">Email me a sign-in link</button></form>') +
    '<p class="fine">Not a client yet? <a href="/start/">Start your free trial</a>. Your information is shown only to you and to Sherif.</p></div></div>';
}
function fbDue(cl) {
  if (cl.lastFeedback && daysFrom(cl.lastFeedback) != null && daysFrom(cl.lastFeedback) > -10) return false;
  var since = cl.startDate ? -daysFrom(cl.startDate) : null, left = daysFrom(cl.trialEnds);
  return (since != null && since >= 6) || (left != null && left >= 0 && left <= 4);
}
function vFeedback() {
  var f = S.fb;
  var scale = function (key, from, to) { var out = ''; for (var i = from; i <= to; i++) out += '<button type="button" data-fb="' + key + '" data-v="' + i + '" aria-pressed="' + (f[key] === i) + '">' + i + '</button>'; return '<div class="scale">' + out + '</div>'; };
  var pick = function (key, opts) { return '<div class="scale">' + opts.map(function (o) { return '<button type="button" data-fb="' + key + '" data-v="' + o + '" aria-pressed="' + (f[key] === o) + '">' + o + '</button>'; }).join('') + '</div>'; };
  if (S.fbDone) return hero('home', 'Your feedback', 'Thank you.', 'Sherif reads every answer himself.') + '<main class="wrap narrow pbody"><div class="card"><p style="margin:0">Got it. If you wrote something that needs a reply, you\'ll hear back within a day.</p><p style="margin:12px 0 0"><button class="btn gold" data-go="home">Back to your portal</button></p></div></main>' + mobnav('home');
  return hero('home', 'Your feedback', 'How is it going so far?', 'Five quick questions, about two minutes. Be blunt; it only helps.') +
    '<main class="wrap narrow pbody"><div class="card">' +
    '<div class="fbq"><div class="lab">How likely are you to recommend Steady Path to a friend?</div>' + scale('rec', 0, 10) + '<div class="scale-ends"><span>Not at all</span><span>Definitely</span></div></div>' +
    '<div class="fbq"><div class="lab">How useful have the jobs we sent been?</div>' + scale('jobs', 1, 5) + '<div class="scale-ends" style="max-width:250px"><span>Not useful</span><span>Very useful</span></div></div>' +
    '<div class="fbq"><label for="fbHelp">What has helped you most?</label><textarea id="fbHelp" maxlength="1500">' + esc(S.fbText.help || '') + '</textarea></div>' +
    '<div class="fbq"><label for="fbChange">What is one thing you would change?</label><textarea id="fbChange" maxlength="1500">' + esc(S.fbText.change || '') + '</textarea></div>' +
    '<div class="fbq"><div class="lab">Would you pay to keep going after your free trial?</div>' + pick('pay', ['Yes', 'Maybe', 'No']) + '<label for="fbWhy" style="font-weight:600;color:var(--muted)">Why? (optional)</label><textarea id="fbWhy" maxlength="1500" style="min-height:60px">' + esc(S.fbText.why || '') + '</textarea></div>' +
    (S.fbErr ? '<div class="warn" style="margin-top:14px">' + esc(S.fbErr) + '</div>' : '') +
    '<p style="margin:18px 0 0"><button class="btn gold" data-fbsubmit ' + (S.fbBusy ? 'disabled' : '') + '>' + (S.fbBusy ? 'Sending…' : 'Send feedback') + '</button></p>' +
    '</div></main>' + mobnav('home');
}
function sendFeedback() {
  var f = S.fb, tx = function (id) { var el = $(id); return el ? el.value.trim() : ''; };
  S.fbText = { help: tx('#fbHelp'), change: tx('#fbChange'), why: tx('#fbWhy') };
  if (f.rec == null && f.jobs == null && !S.fbText.help && !S.fbText.change && !f.pay) { S.fbErr = 'Answer at least one question first.'; render(); return; }
  S.fbBusy = true; S.fbErr = ''; render();
  post({ action: 'feedback', t: S.token, recommend: f.rec, jobsUseful: f.jobs, mostHelpful: S.fbText.help, oneChange: S.fbText.change, wouldPay: f.pay || '', why: S.fbText.why }).then(function (d) {
    S.fbBusy = false;
    if (d.ok) { S.fbDone = true; S.data.client.lastFeedback = new Date().toISOString().slice(0, 10); window.scrollTo(0, 0); }
    else S.fbErr = d.error === 'expired' ? 'Your sign-in expired. Request a new link from the sign-in page, then send this again.' : 'Not sent. Try again in a minute.';
    render();
  }).catch(function () { S.fbBusy = false; S.fbErr = 'Not sent. Check your connection and try again.'; render(); });
}
function nextStep(d) {
  var c = counts(), first = d.client.firstName;
  var waitDoc = (d.docs || []).filter(function (x) { return /ready|review/i.test(x.status || ''); })[0];
  var soon = (d.apps || []).filter(function (x) { var n = daysFrom(x.interview); return n != null && n >= 0; }).sort(function (a, b) { return daysFrom(a.interview) - daysFrom(b.interview); })[0];
  if (soon) return { t: 'Interview ' + (daysFrom(soon.interview) === 0 ? 'today' : 'on ' + fmtDate(soon.interview)) + ' at ' + soon.company, s: 'Your prep sheet and practice cards are ready.', go: 'apps', b: 'Practice now' };
  if (waitDoc) return { t: 'Review ' + waitDoc.name, s: 'Approve it or ask for changes. Applications go out after you approve.', go: 'docs', b: 'Open documents' };
  if (c.wait) return { t: 'Mark your ' + c.wait + ' waiting job' + (c.wait === 1 ? '' : 's'), s: 'Yes, No or Question. Each Yes gets a tailored resume and cover letter.', go: 'jobs', b: 'Review jobs' };
  if (!d.jobs.length) return { t: 'Sherif is reading your resume', s: 'Expect a short note with any questions within one business day. Your first matches follow once titles are agreed.', go: '', b: '' };
  if (c.yes && !(d.apps || []).length) return { t: 'Your tailored documents are being written', s: 'You will see them in Documents to approve, usually within 2 business days.', go: 'docs', b: 'Documents' };
  return { t: 'All caught up, ' + first, s: 'New matches arrive each week. Sherif is following up on everything in progress.', go: 'apps', b: 'Applications' };
}
function vHome() {
  var d = S.data, c = counts(), cl = d.client;
  var pl = function (n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); };
  var title = !d.jobs.length ? 'Your search is being set up.' : c.wait ? (c.wait === d.jobs.length ? pl(d.jobs.length, 'job') + (d.jobs.length === 1 ? ' is' : ' are') + ' waiting for your call.' : pl(c.wait, 'job') + (c.wait === 1 ? ' still needs' : ' still need') + ' an answer.') : 'All caught up. Sherif is on it.';
  return hero('home', esc(SP.greeting(cl.firstName)), title, 'Every job here was checked on the employer\'s own posting, and every one shows pay.') +
    '<main class="wrap narrow pbody">' + (S.flash ? '<div class="sent">' + esc(S.flash) + '</div>' : '') +
    (fbDue(cl) ? '<div class="fbask"><p><b>Two minutes?</b> Tell us how your search is going and what you would change.</p><button class="btn gold" data-go="feedback">Give feedback</button></div>' : '') +
    (function () { var n = nextStep(d); return '<div class="nextcard"><div class="n">Next</div><div><b>' + esc(n.t) + '</b><span>' + esc(n.s) + '</span></div>' + (n.go ? '<button class="btn gold" data-go="' + n.go + '">' + esc(n.b) + '</button>' : '') + '</div>'; })() +
    (cl.weeklyNote ? '<div class="note"><div class="av">S</div><div><div class="from">A note from Sherif' + (cl.lastTouch ? ' · ' + esc(fmtDate(cl.lastTouch)) : '') + '</div><p class="q" style="font-size:17px">' + esc(cl.weeklyNote) + '</p></div></div>' : '') +
    '<div class="stats"><div class="stat"><div class="v">' + c.wait + '</div><div class="l">Jobs waiting for you</div></div><div class="stat"><div class="v">' + c.yes + '</div><div class="l">Yes, apply</div></div><div class="stat"><div class="v">' + d.apps.length + '</div><div class="l">Applications sent</div></div><div class="stat"><div class="v">' + (daysFrom(cl.trialEnds) != null && daysFrom(cl.trialEnds) >= 0 ? daysFrom(cl.trialEnds) : '–') + '</div><div class="l">Days left in your trial</div></div></div>' +
    (d.jobs.length ? '<div><button class="btn gold" data-go="jobs" style="font-size:15px;padding:12px 20px">Review your ' + d.jobs.length + ' job matches</button></div>' : '') +
    '<div class="promise"><div><b>Pay on every match</b><span>From the employer\'s posting, or labeled as an estimate.</span></div><div><b>Checked live</b><span>A person opened each posting before it reached you.</span></div><div><b>Tailored per job</b><span>Your resume and cover letter rewritten for every Yes.</span></div></div>' +
    '<div class="card"><h3>Need something?</h3><p class="psub" style="margin:0">Reply to any email from hello@steadypathcareers.com, or text Sherif. Thoughts on how this is going? <a href="#" data-gofb>Tell us here</a>.</p></div></main>' + mobnav('home');
}
function jobCard(j) {
  var a = String(j.answer || '').toLowerCase(); var ans = a.indexOf('yes') === 0 ? 'yes' : a.indexOf('no') === 0 ? 'no' : a ? 'q' : '';
  var est = /estimate/i.test(j.paySource) || /not posted/i.test(j.pay); var busy = S.pending[j.id];
  var heads = /below/i.test(j.floor) ? 'Heads-up: this one is below your pay floor. Aim for the top of the range if you go for it.' : '';
  return '<div class="jobcard ' + (ans ? 'answered' : '') + '"><div class="band"></div><div class="in">' +
    '<div class="top"><div><div class="title">' + esc(j.title) + '</div><div class="co">' + esc(j.company) + ' · ' + esc(j.location) + '</div></div><div class="paybox ' + (est ? 'est' : '') + '"><div class="amt">' + esc(String(j.pay).split(';')[0]) + '</div><div class="src">' + (est ? 'Estimate. Employer did not post pay.' : 'Posted by the employer') + '</div></div></div>' +
    '<div class="tags">' + floorPill(j.floor) + (j.setting ? '<span class="pill">' + esc(j.setting) + '</span>' : '') + '<span class="pill check">Checked live ' + esc(fmtDate(j.added)) + '</span></div>' +
    (j.why ? '<p class="why">' + esc(j.why) + '</p>' : '') + (j.notes ? '<p class="heads">' + esc(j.notes) + '</p>' : heads ? '<p class="heads">' + heads + '</p>' : '') +
    '<div class="answer"><button class="yes" data-ans="yes" data-j="' + esc(j.id) + '" aria-pressed="' + (ans === 'yes') + '" ' + (busy ? 'disabled' : '') + '>Yes, apply</button><button class="no" data-ans="no" data-j="' + esc(j.id) + '" aria-pressed="' + (ans === 'no') + '" ' + (busy ? 'disabled' : '') + '>No</button><button class="q" data-ans="q" data-j="' + esc(j.id) + '" aria-pressed="' + (ans === 'q') + '" ' + (busy ? 'disabled' : '') + '>Question</button>' +
    (busy ? '<span class="saved" style="color:var(--muted)">Saving…</span>' : ans ? '<span class="saved">Saved</span>' : '') + (S.errJob === j.id && S.err ? '<span class="err">' + esc(S.err) + '</span>' : '') +
    (j.link ? '<a href="' + esc(j.link) + '" target="_blank" rel="noopener">See the posting</a>' : '') +
    (S.data.client.home && j.location && !/^\s*remote/i.test(j.location) ? '<a class="commute" href="https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(S.data.client.home) + '&destination=' + encodeURIComponent(j.company + ', ' + j.location) + '" target="_blank" rel="noopener">Commute from home</a>' : '') + '</div>' +
    (ans === 'q' || ans === 'no' ? '<div class="notebox"><textarea placeholder="' + (ans === 'q' ? 'Your question for Sherif' : 'Optional: why not? It helps me aim the next ones.') + '" data-note="' + esc(j.id) + '">' + esc(S.notes[j.id] != null ? S.notes[j.id] : (j.note || '')) + '</textarea><button data-savenote="' + esc(j.id) + '" data-a="' + ans + '">Send</button></div>' : '') +
    '</div></div>';
}
function vJobs() {
  var d = S.data, c = counts();
  var sorted = d.jobs.slice().sort(function (a, b) { return (a.answer ? 1 : 0) - (b.answer ? 1 : 0) || String(b.added).localeCompare(String(a.added)); });
  return hero('jobs', 'Your job matches', !d.jobs.length ? 'Your first matches are on the way.' : c.wait ? c.wait + (c.wait === 1 ? ' still needs' : ' still need') + ' an answer.' : 'All answered. Sherif is on it.', 'Pay comes from the employer\'s posting unless marked as an estimate.') +
    '<main class="wrap narrow pbody">' + (sorted.length ? sorted.map(jobCard).join('') : '<div class="card"><p class="psub" style="margin:0">Nothing here yet. Jobs appear once your resume is set and the search has run; you\'ll get an email the moment they do.</p></div>') + '</main>' + mobnav('jobs');
}
function vDocs() {
  var d = S.data;
  return hero('docs', 'Your documents', d.docs.length ? 'Open, comment, approve.' : 'Your resume review is in progress.', 'Tailored versions appear here for every job you say Yes to.') +
    '<main class="wrap narrow pbody"><div class="card">' + (d.docs.length ? d.docs.map(function (x) {
      var st = String(x.status || ''); var pillCls = /approved/i.test(st) ? 'ok' : /changes/i.test(st) ? 'gold' : 'info';
      return '<div class="docrow"><div><b>' + esc(x.name) + '</b><div class="psub">' + (x.updated ? 'Updated ' + esc(fmtDate(x.updated)) + ' · ' : '') + '<span class="pill ' + pillCls + '">' + esc(st || 'In progress') + '</span></div>' + (x.request ? '<div class="psub" style="margin-top:4px">Your note: ' + esc(x.request) + '</div>' : '') + '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (x.link ? '<a class="btn ghost" href="' + esc(x.link) + '" target="_blank" rel="noopener">Open</a>' : '') + (/ready|review/i.test(st) ? '<button class="btn" data-approve="' + esc(x.id) + '">Approve</button><button class="btn ghost" data-changes="' + esc(x.id) + '">Ask for changes</button>' : '') + '</div>' +
        (S.changesFor === x.id ? '<div class="notebox" style="width:100%"><textarea placeholder="What should change?" id="changesText"></textarea><button data-sendchanges="' + esc(x.id) + '">Send</button></div>' : '') + '</div>';
    }).join('') : '<p class="psub" style="margin:0">Your resume draft will show up here with a button to approve it or ask for changes.</p>') + '</div></main>' + mobnav('docs');
}
function stageOf(x) { var t = String(x.status || '').toLowerCase(); if (/offer|hired|accepted/.test(t)) return 3; if (x.interview || /interview/.test(t)) return 2; if (/reply|heard|screen|call|contact/.test(t)) return 1; if (/reject|declin|closed|no longer/.test(t)) return 3; return 0; }
function lines(t) { return String(t || '').split(/\n|;|(?:\s\d+\.\s)/).map(function (z) { return z.trim(); }).filter(String); }
function vApps() {
  var d = S.data, cols = ['Applied', 'Heard back', 'Interview', 'Offer or closed'], by = [[], [], [], []];
  d.apps.forEach(function (x) { by[stageOf(x)].push(x); });
  var prepApp = S.prep ? d.apps.filter(function (x) { return x.id === S.prep; })[0] : null;
  var practice = '';
  if (prepApp) {
    var qs = lines(prepApp.prepExpect); var i = Math.min(S.card || 0, Math.max(qs.length - 1, 0));
    practice = '<div class="card"><h3>Practice: ' + esc(prepApp.company) + '</h3>' + (qs.length ? '<p class="psub" style="margin:0">Say your answer out loud, then tap the card to see what to bring up.</p><div class="flipbox"><div class="flip' + (S.flipped ? ' back' : '') + '" data-flip role="button" tabindex="0">' +
      (S.flipped ? '<small>Bring up</small><div>' + esc(prepApp.prepBring || 'Use a real example with a number in it.') + '</div>' : '<small>Question ' + (i + 1) + ' of ' + qs.length + '</small><div style="font-weight:800;font-size:18px">' + esc(qs[i]) + '</div>') +
      '</div><div class="fliprow"><button class="btn ghost" data-card="-1"' + (i ? '' : ' disabled') + '>Previous</button><button class="btn" data-card="1"' + (i < qs.length - 1 ? '' : ' disabled') + '>Next question</button></div></div>' : '<p class="psub">Questions will appear here once your prep sheet is ready.</p>') +
      (prepApp.prepAsk ? '<p style="margin:12px 0 0"><b>Questions to ask them:</b> ' + esc(prepApp.prepAsk) + '</p>' : '') + '<p style="margin:12px 0 0"><button class="btn ghost" data-prep="">Close practice</button></p></div>';
  }
  return hero('apps', 'Applications and interviews', d.apps.length ? d.apps.length + ' sent so far.' : 'Nothing submitted yet.', 'Every application, where it stands, and a prep sheet the moment an interview is booked.') +
    '<main class="wrap narrow pbody" style="max-width:1100px">' + practice + (d.apps.length ? '<div class="board">' + cols.map(function (c, k) {
      return '<div class="col"><h3>' + c + '<span>' + by[k].length + '</span></h3>' + by[k].map(function (x) {
        var hasPrep = x.prepBring || x.prepExpect || x.prepAsk;
        return '<div class="app"><b>' + esc(x.company) + '</b><div class="psub">' + esc(x.role) + '</div><div class="psub" style="margin-top:4px">Applied ' + esc(fmtDate(x.applied)) + (x.status ? ' · ' + esc(x.status) : '') + '</div>' +
          (x.interview ? '<div style="margin-top:6px"><span class="pill info">Interview ' + esc(fmtDate(x.interview)) + '</span></div>' : '') + (String(x.followUpDue).toLowerCase() === 'yes' ? '<div style="margin-top:6px"><span class="pill gold">Follow-up due</span></div>' : '') +
          (hasPrep ? '<p style="margin:8px 0 0"><button class="btn" data-prep="' + esc(x.id) + '">Interview practice</button></p>' : '') + '</div>';
      }).join('') + '</div>';
    }).join('') + '</div>' : '<div class="card"><p class="psub" style="margin:0">Your first application goes out within 2 business days of your first Yes, after you\'ve approved the tailored resume.</p></div>') + '</main>' + mobnav('apps');
}

function render() {
  var app = $('#app');
  if (S.status === 'signin') { app.innerHTML = vSignin(); return; }
  if (S.status === 'loading' || S.status === 'boot') { app.innerHTML = '<div class="skel">Opening your portal…</div>'; return; }
  if (S.status === 'error') { app.innerHTML = '<div class="wrap narrow pbody"><div class="warn">Could not reach the portal. Check your connection and <button class="btn ghost" data-retry>try again</button>.</div></div>'; return; }
  var y = window.scrollY;
  app.innerHTML = ({ home: vHome, jobs: vJobs, docs: vDocs, apps: vApps, feedback: vFeedback }[S.view] || vHome)();
  window.scrollTo(0, y);
}

document.addEventListener('submit', function (e) { if (e.target.id === 'linkForm') { e.preventDefault(); requestLink($('#email').value.trim()); } });
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-flip]')) { S.flipped = !S.flipped; render(); return; }
  var lk = e.target.closest('[data-gofb]'); if (lk) { e.preventDefault(); S.view = 'feedback'; render(); window.scrollTo(0, 0); return; }
  var b = e.target.closest('button'); if (!b) return; var d = b.dataset;
  if (d.fb) { ['#fbHelp', '#fbChange', '#fbWhy'].forEach(function (id, i) { var el = $(id); if (el) S.fbText[['help', 'change', 'why'][i]] = el.value; }); var v = /^\d+$/.test(d.v) ? Number(d.v) : d.v; S.fb[d.fb] = S.fb[d.fb] === v ? null : v; render(); return; }
  if (d.fbsubmit != null) { sendFeedback(); return; }
  if (d.prep != null) { S.prep = d.prep || null; S.card = 0; S.flipped = false; render(); if (S.prep) window.scrollTo(0, 0); return; }
  if (d.card) { S.card = (S.card || 0) + Number(d.card); S.flipped = false; render(); return; }
  if (d.go) { S.view = d.go; S.flash = ''; render(); window.scrollTo(0, 0); return; }
  if (d.retry != null) { load(); return; }
  if (d.signout != null) { try { localStorage.removeItem('sp_token'); } catch (x) {} S.token = null; S.data = null; S.status = 'signin'; S.sent = false; S.err = ''; render(); return; }
  if (d.ans) { var j = S.data.jobs.filter(function (x) { return x.id === d.j; })[0]; var cur = String(j.answer || '').toLowerCase(); var same = (d.ans === 'yes' && cur.indexOf('yes') === 0) || (d.ans === 'no' && cur.indexOf('no') === 0) || (d.ans === 'q' && cur && cur.indexOf('yes') !== 0 && cur.indexOf('no') !== 0); answer(d.j, same ? '' : d.ans); return; }
  if (d.savenote) { var ta = document.querySelector('[data-note="' + d.savenote + '"]'); S.notes[d.savenote] = ta ? ta.value : ''; answer(d.savenote, d.a, S.notes[d.savenote]); return; }
  if (d.approve) { docStatus(d.approve, 'Approved', ''); return; }
  if (d.changes) { S.changesFor = d.changes; render(); return; }
  if (d.sendchanges) { var t = $('#changesText'); S.changesFor = null; docStatus(d.sendchanges, 'Changes requested', t ? t.value : ''); return; }
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-flip]')) { e.preventDefault(); S.flipped = !S.flipped; render(); var f = document.querySelector('[data-flip]'); if (f) f.focus(); } });
document.addEventListener('input', function (e) { if (e.target.dataset.note) S.notes[e.target.dataset.note] = e.target.value; });
load();
</script>
</body>
</html>
