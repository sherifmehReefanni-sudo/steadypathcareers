<link rel="stylesheet" href="../assets/site.css?v=20261023a">
<style>
/* ---- portal tokens ---- */
:root { --yes: #1f7a46; --yes-bg: #edf8f1; --yes-line: #9fd3b2; --q: #8a6400; --q-bg: #fff6df; --q-line: #e6c66d; --no-bg: #f2f2ef; --no-line: #d6d6d0; --no-ink: #5f6470; --tabh: 64px; }
body { overflow-x: hidden; }
.pmain { max-width: 760px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.pmain.wide { max-width: 1100px; }
.pmain, .jc, .dc, .app, .wnote, .kit, .deck { overflow-wrap: anywhere; }
.btn.sm { padding: 6px 12px; font-size: 14px; margin-left: 6px; }
.help { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; display: grid; gap: 4px; color: var(--muted); font-size: 15px; }
.help p { margin: 0; }
.help b { color: var(--ink); }
.acct .menu .mhelp { margin: 4px 0 0; padding: 10px 14px 8px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); overflow-wrap: anywhere; max-width: 240px; }
.acct .menu .mhelp b { color: var(--ink); display: block; }
.jc .live { margin: 8px 0 0; }
.jc .live .pill { white-space: normal; text-align: left; }
.jc.leave { opacity: .55; transform: scale(.98); }
.ptitle h1:focus { outline: none; }
.ptitle h1:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- header ---- */
.sky { overflow: visible; background-color: var(--navy); }
.ptop { display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top, 0px)) 0 12px; min-height: 60px; }
.ptop .brand { min-height: 44px; }
.ptop .brand { font-size: 16px; min-width: 0; }
.ptop .brand svg { width: 32px; height: 32px; flex: none; }
.ptop .brand .bname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-badge { background: var(--dawn); color: var(--midnight); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 3px 10px; letter-spacing: .03em; flex: none; }
.ptabs { display: flex; gap: 2px; margin-left: 10px; }
.ptabs button { border: 0; background: transparent; color: #d7e0ee; padding: 9px 14px; border-radius: 9px; font-weight: 800; font-size: 15px; display: inline-flex; gap: 7px; align-items: center; min-height: 44px; }
.ptabs button svg { width: 18px; height: 18px; }
.ptabs button[aria-current="true"] { background: rgba(251,246,238,.14); color: #fff; }
.ptabs .cnt, .tabbar .cnt { background: var(--gold); color: var(--midnight); border-radius: 99px; font-size: 11.5px; font-weight: 800; padding: 1px 7px; line-height: 1.5; }
.acct { margin-left: auto; position: relative; flex: none; }
.acct > button { border: 0; background: rgba(251,246,238,.12); color: var(--cream); border-radius: 99px; min-height: 44px; padding: 6px 12px 6px 6px; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.acct .av { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--midnight); display: grid; place-items: center; font-weight: 800; }
.acct .menu { position: absolute; right: 0; top: calc(100% + 6px); background: #fff; color: var(--ink); border-radius: 14px; box-shadow: 0 16px 40px rgba(16,33,58,.25); padding: 6px; min-width: 200px; z-index: 30; display: grid; }
.acct .menu button { border: 0; background: transparent; text-align: left; padding: 12px 14px; min-height: 44px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--navy); }
.acct .menu button:hover { background: var(--sunk); }
.ptitle { padding: 2px 0 18px; }
.ptitle h1 { font: 800 clamp(24px, 3.6vw, 34px)/1.1 var(--display); letter-spacing: -0.02em; margin: 0; color: var(--cream); }
.ptitle p { margin: 4px 0 0; color: #d7e0ee; font-size: 15px; }
.sky svg.scene { margin-top: -6px; }

/* ---- bottom tab bar (phones) ---- */
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(16,33,58,.08); padding: 4px max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tabbar nav { display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { border: 0; background: transparent; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-weight: 800; font-size: 13px; position: relative; border-radius: 12px; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-current="true"] { color: var(--navy); }
.tabbar button[aria-current="true"]::before { content: ""; position: absolute; top: 0; width: 36px; height: 3px; border-radius: 3px; background: var(--gold); }
.tabbar .cnt { position: absolute; top: 4px; left: calc(50% + 8px); }

/* ---- top of Jobs ---- */
.hello { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hello b { font-size: 20px; color: var(--navy); }
.hello span { color: var(--muted); font-size: 14px; font-weight: 700; }
.prog { display: grid; gap: 6px; }
.prog .lbl { font-weight: 800; font-size: 16px; color: var(--ink); }
.prog .bar { height: 8px; border-radius: 99px; background: #e7e1d3; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
.nextc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--navy); color: var(--cream); border-radius: 16px; padding: 14px 16px; }
.nextc small { display: block; color: var(--dawn); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.nextc b { display: block; font-size: 17px; line-height: 1.25; }
.nextc span { display: block; color: #d7e0ee; font-size: 14px; margin-top: 2px; }
.nextc .btn { min-height: 44px; }
.wnote { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.wnote .av { width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: var(--dawn); display: grid; place-items: center; font-weight: 800; }
.wnote .from { font-size: 13px; color: var(--muted); font-weight: 700; }
.wnote p { margin: 2px 0 0; font: italic 500 17px/1.4 var(--serif); color: var(--ink); }
.wnote.clamp p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wnote .more { border: 0; background: none; padding: 6px 0 0; min-height: 44px; min-width: 44px; color: var(--navy); font-weight: 800; font-size: 14px; text-decoration: underline; }
.fbask { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.fbask p { margin: 0; font-weight: 700; }
.a2hs { background: linear-gradient(135deg, var(--midnight), var(--navy)); color: var(--cream); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; }
.a2hs .ic svg { width: 30px; height: 30px; }
.a2hs b { color: var(--dawn); }
.a2hs p { margin: 2px 0 0; font-size: 14px; color: #d7e0ee; }
.a2hs .row { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.a2hs .row .btn.ghost { background: transparent; color: var(--cream); border-color: rgba(251,246,238,.45); }
.sec-h { font: 800 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }

/* ---- job cards ---- */
.jlist { display: flex; flex-direction: column; gap: 14px; }
.jc { position: relative; background: #fff; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: pan-y; box-shadow: 0 2px 10px rgba(16,33,58,.05); }
.jc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--navy); }
.jc .in { padding: 16px 16px 14px 22px; display: flex; flex-direction: column; gap: 10px; }
.jc .jst { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; }
.jc .jst svg { width: 22px; height: 22px; flex: none; }
.jc .ttl { font: 800 21px/1.2 var(--display); letter-spacing: -0.015em; color: var(--navy); margin: 0; }
.jc .pay { font: 800 22px/1.15 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.jc .pay small { display: inline-block; font: 700 13px var(--display); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.jc .pay.est { font-size: 18px; color: #6f5300; }
.jc .where { color: var(--muted); font-size: 15.5px; font-weight: 600; }
.jc .pills { display: flex; flex-wrap: wrap; gap: 6px; }
.jc .ans3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 14px 22px; border-top: 1px solid rgba(0,0,0,.06); background: rgba(255,255,255,.6); }
.jc .ans3 button { min-height: 48px; border-radius: 12px; border: 2px solid #7b869a; background: #fff; font-weight: 800; font-size: 16px; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; }
.jc .ans3 button svg { width: 18px; height: 18px; flex: none; }
.jc .ans3 button.yes[aria-pressed="true"] { background: var(--yes); border-color: var(--yes); color: #fff; }
.jc .ans3 button.q[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--midnight); }
.jc .ans3 button.no[aria-pressed="true"] { background: var(--no-ink); border-color: var(--no-ink); color: #fff; }
.jc .ans3 button[aria-disabled="true"] { cursor: wait; border-style: dashed; }
.jc .dtog { align-self: flex-start; border: 0; background: none; padding: 6px 0; min-height: 44px; min-width: 44px; font-weight: 800; font-size: 15px; color: var(--navy); display: inline-flex; gap: 6px; align-items: center; }
.jc .dtog svg { width: 16px; height: 16px; transition: transform .15s; }
.jc .dtog[aria-expanded="true"] svg { transform: rotate(180deg); }
.jc .det { display: grid; gap: 10px; padding: 12px 14px; background: rgba(246,237,217,.55); border-radius: 12px; font-size: 15.5px; line-height: 1.5; }
.jc .det p { margin: 0; }
.jc .det .lab { font-weight: 800; color: var(--navy); display: block; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.jc .det .heads { background: var(--gold-soft); border-radius: 10px; padding: 8px 10px; }
.jc .det .dlinks { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0; }
.jc .det .dlinks a, .jc .det .dlinks button { font-weight: 800; color: var(--navy); font-size: 15px; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; }
.jc .det .dlinks button { border: 0; background: none; padding: 0; text-decoration: underline; color: var(--muted); }
.jc .note2 { display: grid; gap: 8px; }
.jc .note2 textarea { width: 100%; border: 1.5px solid #d3dae6; border-radius: 12px; padding: 10px 12px; font: 16px var(--display); min-height: 70px; resize: vertical; color: var(--ink); background: #fff; }
.jc .note2 .row { display: flex; gap: 8px; align-items: center; }
.jc .note2 .btn { min-height: 44px; }
.jc .err { color: var(--bad); font-weight: 700; font-size: 14px; margin: 0; }
.jc .saving { color: var(--muted); font-weight: 700; font-size: 14px; }
.jc .nstep { margin: 0; font-weight: 700; font-size: 15px; }
.hint { margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--info-soft); color: var(--info); border-radius: 10px; padding: 6px 6px 6px 12px; font-weight: 800; font-size: 14px; }
.hint button { border: 0; background: none; color: var(--info); min-width: 44px; min-height: 44px; font-size: 20px; line-height: 1; }
/* round 3: fit, watch-out, next action on the card face, collapsed answer for a Yes job */
.jc .jfit { margin: 0; font-size: 15.5px; line-height: 1.4; color: var(--ink); }
.jc .jwatch { margin: 0; font-size: 15px; line-height: 1.4; color: #6b4e00; background: #fff6df; border-radius: 10px; padding: 6px 10px; }
.jc .jwatch b { font-weight: 800; }
.jc .jnext { display: grid; gap: 6px; }
.jc .jnext .kbtn { width: 100%; }
.jc .jnext p { margin: 0; font-size: 15px; font-weight: 700; color: var(--muted); }
.jc .jnext p.trknow { color: var(--yes); }
.jc .jchg { padding: 2px 16px 8px 22px; border-top: 1px solid rgba(0,0,0,.06); }
.jc .jchg .linkbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: var(--navy); }
.jc .jchg .linkbtn svg { width: 16px; height: 16px; transition: transform .15s; }
.jc .jchg .linkbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.jc .jchg .ans3 { padding: 4px 0 6px; border-top: 0; background: none; }
.jc .jchg .ans3 button { min-height: 44px; font-size: 15px; }
.jc .det .trk { margin-top: 6px; }
.jc .det .kit { font-size: 15.5px; }
.jc.s-q .jwatch { background: #fff; }
.jm-n { display: none; }
@media (max-width: 760px) { .jm .jm-m { -webkit-line-clamp: 3; font-size: 11px; padding: 3px 1px; letter-spacing: -0.01em; } .jm-m .jm-w { display: none; } .jm-m .jm-n { display: inline; } }
/* round 3: search, sort and filter chips (Jobs and Applied) */
.jfind { display: grid; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.jf-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.jf-row.one { grid-template-columns: minmax(0, 1fr); }
.jf-row label { display: block; font-weight: 800; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.jf-row input, .jf-row select { width: 100%; min-width: 0; box-sizing: border-box; min-height: 44px; padding: 8px 12px; border: 1.5px solid #cfd6e3; border-radius: 10px; font: 16px var(--display); background: #fff; color: var(--ink); }
.jf-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.jf-chips button { min-height: 44px; padding: 0 14px; border-radius: 99px; border: 2px solid #cfd6e3; background: #fff; color: var(--navy); font-weight: 800; font-size: 14.5px; }
.jf-chips button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.jf-st { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 14px; font-weight: 700; color: var(--muted); }
.jf-st:empty { display: none; }
.jf-none { display: grid; gap: 10px; justify-items: start; }
.jf-none p { margin: 0; font-weight: 700; }
@media (max-width: 520px) { .jf-row { grid-template-columns: minmax(0, 1fr); } }

/* status colors */
.jc.s-yes { background: var(--yes-bg); border-color: var(--yes-line); }
.jc.s-yes::before { background: var(--yes); }
.jc.s-yes .jst { color: var(--yes); }
.jc.s-q { background: var(--q-bg); border-color: var(--q-line); }
.jc.s-q::before { background: var(--gold); }
.jc.s-q .jst { color: var(--q); }
.jc.s-no { background: var(--no-bg); border-color: var(--no-line); box-shadow: none; }
.jc.s-no::before { background: #c4c4bd; }
.jc.s-no .jst, .jc.s-no .ttl, .jc.s-no .pay, .jc.s-no .where { color: var(--no-ink); }
.jc.s-no .ttl { font-size: 18px; }
.jc.s-no .pay { font-size: 17px; }

/* tracker */
.trk { list-style: none; margin: 2px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; }
.trk::before { content: ""; position: absolute; top: 9px; left: 10%; right: 10%; height: 3px; background: #cfe5d7; }
.trk::after { content: ""; position: absolute; top: 9px; left: 10%; width: var(--p, 0%); height: 3px; background: var(--yes); }
.trk li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.trk .d { width: 21px; height: 21px; border-radius: 50%; background: #fff; border: 3px solid #b9d9c4; display: grid; place-items: center; z-index: 1; }
.trk .d svg { width: 12px; height: 12px; }
.trk li.done .d { background: var(--yes); border-color: var(--yes); }
.trk li.now .d { background: #fff; border-color: var(--yes); box-shadow: 0 0 0 4px rgba(31,122,70,.2); }
.trk li.now, .trk li.done { color: var(--ink); }
.trk .full { display: inline; }
.trk .short { display: none; }
.trknow { margin: 0; font-size: 15px; font-weight: 800; color: var(--yes); }

/* apply kit */
.kit { background: #fff; border: 1.5px solid var(--yes-line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.kit h3 { margin: 0; font: 800 18px var(--display); color: var(--navy); display: flex; gap: 8px; align-items: center; }
.kit h3 svg { width: 22px; height: 22px; }
.kit .wait { margin: 0; color: var(--muted); font-weight: 700; }
.kit .pdfs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.kbtn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 2px solid var(--navy); background: #fff; color: var(--navy); font-weight: 800; font-size: 15.5px; text-decoration: none; padding: 6px 12px; text-align: center; }
.kbtn svg { width: 20px; height: 20px; flex: none; }
.kbtn.solid { background: var(--navy); color: #fff; }
.kans { display: grid; gap: 8px; }
.kans .knote { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.kans .a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; background: var(--sunk); border-radius: 12px; padding: 10px 10px 10px 12px; }
.kans .a b { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kans .a p { margin: 2px 0 0; font-size: 15.5px; }
.kans .a button { border: 2px solid var(--navy); background: #fff; color: var(--navy); border-radius: 10px; min-height: 44px; min-width: 64px; font-weight: 800; font-size: 14px; }
.kcheck { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: k; }
.kcheck label { display: flex; align-items: center; gap: 12px; min-height: 44px; font-weight: 700; font-size: 15.5px; cursor: pointer; }
.kcheck input { width: 24px; height: 24px; accent-color: var(--yes); }
.kcheck input:checked + span { color: var(--muted); text-decoration: line-through; }
.kdone { min-height: 52px; width: 100%; border: 0; border-radius: 14px; background: var(--yes); color: #fff; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.kdone svg { width: 22px; height: 22px; }
.kdone[disabled] { opacity: .6; cursor: wait; }
.kapplied { margin: 0; font-weight: 800; color: var(--yes); }

/* passed section */
.passed { border-top: 1px dashed #d0cbbd; padding-top: 6px; }
.passed > button { width: 100%; border: 0; background: transparent; display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 4px; font-weight: 800; font-size: 16px; color: var(--no-ink); }
.passed > button svg { width: 20px; height: 20px; transition: transform .15s; }
.passed > button[aria-expanded="true"] svg { transform: rotate(180deg); }
.passed .jlist { margin-top: 6px; }
.closedp .cintro { margin: 0 4px 8px; font-size: 15px; color: var(--no-ink); }
.jc.s-closed { background-color: #F6F4EF; border-style: dashed; box-shadow: none; }
.jc.s-closed::before { background: #c4c4bd; }
.jc.s-closed .jst, .jc.s-closed .ttl, .jc.s-closed .where { color: var(--no-ink); }
.jc .cnote, .dgrp.closed .cnote { margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: var(--no-ink); }
.dgrp.closed .cnote { margin: 0 0 10px; }

/* swipe */
.jc .sl { position: absolute; top: 18px; z-index: 3; font: 800 26px var(--display); letter-spacing: .06em; padding: 4px 14px; border-radius: 10px; border: 3px solid; opacity: 0; pointer-events: none; }
.jc .sl.y { left: 22px; color: var(--yes); border-color: var(--yes); background: rgba(237,248,241,.92); transform: rotate(-8deg); }
.jc .sl.p { right: 16px; color: var(--no-ink); border-color: var(--no-ink); background: rgba(242,242,239,.92); transform: rotate(8deg); }

/* ---- answers ----

      buttons on that card are disabled until the server answers, and "Saved" only shows after the server confirms.
   2. Undo window (swipes, No taps, deck decisions): the card changes on screen right away, nothing is sent for UNDO_MS.
      Undo inside the window cancels locally with no network call. The write goes out when the window ends, when another
      undo-able decision replaces it, when the deck closes, or when the page is hidden (keepalive). */

function pump(id) {

      if (q.next) { pump(id); return; }

      j.answeredOn = d.answer ? todayISO() : '';

/* Looks good: approve every document of this job that needs an OK, one request at a time, through docStatus. */

  S.rvBusy = true; S.changesFor = null;

    if (k >= ids.length) {

      if (jobState(j).applyReady && !jobApp(j) && S.flow && S.flow.job === j.id) { S.flow = { kind: 'apply', job: j.id, from: flowFrom() }; histPush(S.flow); toast('Approved. Now apply in three steps.'); S.focusTo = '.ptitle h1'; render(); window.scrollTo(0, 0); }
      else { toast('Approved. Thank you.'); render(); }

    sendRequest({ type: ty, note: String(S.pf.draft.pfPauseNote || '').trim().slice(0, 1000) }, function (ok) { if (ok) { S.pf.pause = false; delete S.pf.draft.pfPauseNote; S.pf.msg = 'Sent. Sherif will ' + (ty === 'Pause search' ? 'pause' : 'restart') + ' your search after he reviews it, usually within one business day. Until then nothing changes.'; S.focusTo = '#pfMsg'; } }); return; }
  if (d.pfdel != null) { S.pf.del = !!d.pfdel; S.pf.edit = false; S.pf.pause = false; S.pf.err = ''; S.pf.msg = ''; S.focusTo = S.pf.del ? '#pfDelH' : '[data-pfdel]'; render(); return; }
  if (d.pfdelyes != null) { sendRequest({ type: 'Delete my data' }, function (ok) { if (ok) { S.pf.del = false; S.pf.msg = 'Delete request sent. Sherif reviews it, usually within one business day, and will email you. Nothing is deleted before then.'; S.focusTo = '#pfMsg'; } }); return; }
  if (d.export) { var day = todayISO(); if (d.export === 'csv') saveFile('steady-path-applications-' + day + '.csv', 'text/csv;charset=utf-8', appsCsv()); else saveFile('steady-path-my-data-' + day + '.json', 'application/json', JSON.stringify(exportData(), null, 2)); toast('Downloaded.'); return; }
  if (d.ics) { var ap = ((S.data && S.data.apps) || []).filter(function (x) { return String(x.id) === d.ics; })[0], txt = ap && icsFor(ap); if (!txt) return; saveFile('interview-' + slug(ap.company) + '-' + ap.interview + '.ics', 'text/calendar;charset=utf-8', txt); toast('Calendar file downloaded. Open it to add the interview.'); return; }
  if (d.urg != null) { S.urg = { open: !!d.urg }; S.pf.err = ''; S.focusTo = d.urg ? '#urgWhat' : '[data-urg]'; render(); return; }
  if (d.urgsend != null) { sendUrgent(); return; }
});
document.addEventListener('input', function (e) {
  var id = e.target && e.target.id; if (!id || !/^(pf|urg)[A-Z]/.test(id)) return;
  S.pf.draft[id] = e.target.value;
  /* typing clears a "fill this in first" error (not a sign-in one), without re-rendering */
  if (S.pf.err && !S.pf.re) { S.pf.err = ''; var pe = document.querySelector('.pf .err'); if (pe) pe.remove(); }
  if (S.urg && S.urg.err && !S.pf.re) { S.urg.err = ''; var ue = document.getElementById('urgErr'); if (ue) ue.remove(); var w = document.getElementById('urgWhat'); if (w) { w.removeAttribute('aria-invalid'); w.removeAttribute('aria-describedby'); } }
});
/* =================== END ROUND 4 =================== */

<script>
/* ===================== Round 6a: interview prep screen (S.view 'prep', S.pv = { id, from, i, show }), document change history.
   Practice notes stay on this device (localStorage, never sent). "How did it go?" and "Notes for next time" save through saveApp,
   sending only the field that changed. History entries: the "Change log" column, one "YYYY-MM-DD: note" per line. ===================== */
function appById(id) { return ((S.data && S.data.apps) || []).filter(function (x) { return String(x.id) === String(id); })[0] || null; }
/* Questions from "Prep: expect to be asked", split like lines(). "Question :: guidance" gives that question its own guidance.
   When the cell has line breaks, a line with " :: " is kept whole, so its guidance may contain ";". */
function pvQs(x) {
  var t = String((x && x.prepExpect) || '');
  var segs = /\n/.test(t) ? t.split(/\r?\n/).reduce(function (a, l) { return a.concat(l.indexOf(' :: ') >= 0 ? [l.trim()] : lines(l)); }, []) : lines(t);
  return segs.filter(String).slice(0, 40).map(function (l) { var k = l.indexOf(' :: '); return k < 0 ? { q: l, g: '' } : { q: l.slice(0, k).trim(), g: l.slice(k + 4).trim() }; }).filter(function (o) { return o.q; });
}
function pvTxt(v) { return String(v == null ? '' : v).trim(); }
function pvHas(x) { return !!(pvQs(x).length || pvTxt(x.prepBring) || pvTxt(x.prepAsk) || pvTxt(x.prepBrief)); }
function pvAsks(x) { return lines(pvTxt(x.prepAsk).replace(/\?\s+(?=[A-Z])/g, '?\n')); }
function pvDueBtn(x, label) { return '<button class="linkbtn" data-nxprep="' + esc(x.id) + '">' + esc(label) + '</button>'; }
/* Applied card: the way into the prep screen. Upcoming interviews get the prominent button. */
function appPrepBtn(x) {
  var dd = daysFrom(x.interview), st = stageOf(x), has = pvHas(x), qs = pvQs(x).length, id = esc(x.id);
  if (dd != null && dd >= 0 && st < 4) return '<p class="pv-cta"><button class="btn gold" data-prep="' + id + '">' + (qs ? 'Interview practice' : has ? 'Your prep notes' : 'Interview details') + '</button></p>' + (has ? '' : '<p class="psub" style="margin:8px 0 0">' + esc(prepWait(x)) + '</p>');
  if (dd != null && dd < 0 && dd >= -21 && st === 2) return '<p style="margin:8px 0 0"><button class="btn gold" data-prep="' + id + '">How did it go?</button></p>';
  if (has) return '<p style="margin:8px 0 0"><button class="btn' + (qs ? '' : ' ghost') + '" data-prep="' + id + '">' + (qs ? 'Interview practice' : 'Your prep notes') + '</button></p>';
  return '';
}
/* ---- navigation: one history entry, like the review and apply screens ---- */
function openPrep(id) {
  var x = appById(id); if (!x) return;
  var from = S.flow ? flowFrom() : S.view === 'prep' && S.pv ? S.pv.from : /^(jobs|docs|apps)$/.test(S.view) ? S.view : 'apps';
  /* the entry we leave stands for the tab we were on, so Back lands there */
  if (!S.flow && S.view !== 'prep') { try { history.replaceState({ sp: 1, depth: S.hist, flow: null, view: from }, '', location.href); } catch (e) {} }
  S.pv = { id: String(x.id), from: from, i: 0, show: false, next: null, msg: '' };
  S.flow = null; S.view = 'prep'; S.menu = false; S.flash = ''; S.updFor = null; S.upDraft = null; S.focusTo = '.ptitle h1';
  try { history.pushState({ sp: 1, depth: S.hist + 1, flow: null, view: 'prep', prep: String(x.id), from: from }, '', location.href); S.hist++; } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function closePrep() {
  var from = (S.pv && S.pv.from) || 'apps', onEntry = false;
  try { onEntry = !!(history.state && history.state.view === 'prep'); } catch (e) {}
  S.view = from; S.focusTo = '.ptitle h1'; render(); window.scrollTo(0, 0);
  if (S.hist > 0 && onEntry) { quietPop(); try { history.back(); } catch (e) {} }
}
function prepPop(st) {
  var x = appById(st.prep); if (!x) return false;
  if (!S.pv || S.pv.id !== String(x.id)) S.pv = { id: String(x.id), i: 0, show: false, next: null, msg: '' };
  S.pv.from = /^(jobs|docs|apps)$/.test(st.from || '') ? st.from : 'apps';
  S.flow = null; S.view = 'prep'; S.menu = false; S.focusTo = '.ptitle h1'; render(); window.scrollTo(0, 0); return true;
}
/* ---- practice notes: this device only ---- */
function pvNotes(appId) { S.pvMem = S.pvMem || {}; if (!S.pvMem[appId]) { var o = {}; try { o = JSON.parse(lsGet('sp_pvnotes_' + appId) || '{}') || {}; if (typeof o !== 'object' || Array.isArray(o)) o = {}; } catch (e) { o = {}; } S.pvMem[appId] = o; } return S.pvMem[appId]; }
function pvNoteKey(q) { return String(q).slice(0, 200); }
function pvSaveNote(appId, q, v) { var o = pvNotes(appId); if (v) o[pvNoteKey(q)] = String(v).slice(0, 2000); else delete o[pvNoteKey(q)]; try { lsSet('sp_pvnotes_' + appId, JSON.stringify(o)); } catch (e) {} }
/* ---- the screen ---- */
function pvWhere(w) {
  w = pvTxt(w); if (!w) return '';
  var m = w.match(/https?:\/\/[^\s<>"']+/i);
  if (m) { var u = safeUrl(m[0].replace(/[).,;]+$/, '')), k = w.indexOf(m[0]); if (u) return esc(w.slice(0, k)) + '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a>' + esc(w.slice(k + u.length)); }
  if (!/\d/.test(w) || /\b(phone|video|zoom|teams|meet|call|online|virtual)\b/i.test(w)) return esc(w); /* only an address gets a map link */
  return esc(w) + '<br><a class="pv-map" href="' + esc('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(w)) + '" target="_blank" rel="noopener noreferrer">Open in Maps</a>';
}
function vPrep() {
  var x = S.pv && appById(S.pv.id);
  if (!x) { S.view = (S.pv && S.pv.from) || 'apps'; return ({ jobs: vJobs, docs: vDocs, apps: vApps }[S.view] || vApps)(); }
  var P = S.pv, from = P.from, dd = daysFrom(x.interview), st = stageOf(x), qs = pvQs(x), has = pvHas(x), out = '';
  var sec = function (k, title, body, cls) { return '<section class="card pv-sec' + (cls ? ' ' + cls : '') + '" aria-labelledby="pv-' + k + '"><h2 class="pv-h" id="pv-' + k + '">' + title + '</h2>' + body + '</section>'; };
  var row = function (k, v) { return '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>'; };
  /* 1. logistics */
  var ivRaw = pvTxt(x.interview), rel = dd == null ? '' : dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : dd > 1 ? 'In ' + dd + ' days' : '';
  var when = [rel, ISO_RE.test(ivRaw) ? fmtY(ivRaw) : ivRaw, pvTxt(x.ivTime)].filter(String).join(', ');
  var lg = (when ? row('When', esc(when)) : '') + (pvTxt(x.ivWhere) ? row('Where', pvWhere(x.ivWhere)) : '') + (pvTxt(x.contact) ? row('Contact', esc(pvTxt(x.contact))) : '');
  if (lg) out += sec('when', dd != null && dd < 0 ? 'Your interview' : 'Your interview details', '<dl class="pv-dl">' + lg + '</dl>' + icsBtn(x));
  var top = out; out = ''; /* after the interview, "How did it go?" goes right under the logistics */
  /* 2. brief */
  var brief = pvTxt(x.prepBrief).split(/\r?\n+/).map(pvTxt).filter(String);
  if (brief.length) out += sec('brief', 'About ' + esc(coOr(x)) + (pvTxt(x.role) ? ' and the role' : ''), '<div class="pv-brief">' + brief.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>');
  /* 3 + 4. practice, one question at a time, with private notes */
  if (qs.length) {
    var i = Math.min(Math.max(P.i || 0, 0), qs.length - 1), q = qs[i], guide = q.g || pvTxt(x.prepBring); P.i = i;
    var note = pvNotes(x.id)[pvNoteKey(q.q)] || '';
    out += sec('practice', 'Practice, one question at a time',
      '<p class="pv-prog" role="status">Question ' + (i + 1) + ' of ' + qs.length + '</p>' +
      '<div class="pv-q"><p class="pv-qt" id="pvQ" tabindex="-1">' + esc(q.q) + '</p><p class="psub">Answer out loud first, as if you were in the room.</p>' +
      '<button type="button" class="kbtn" data-pvshow aria-expanded="' + !!P.show + '" aria-controls="pvGuide">' + (P.show ? 'Hide what to bring up' : 'Show what to bring up') + '</button>' +
      '<div class="pv-guide" id="pvGuide"' + (P.show ? '' : ' hidden') + '><b>' + (q.g ? 'For this question' : 'What to bring up') + '</b><p>' + esc(guide || 'Use a real example with a number in it.') + '</p></div></div>' +
      '<div class="pv-notes"><label for="pvNote">Your notes on this question</label><textarea id="pvNote" data-pvnote="' + esc(x.id) + '" maxlength="2000" aria-describedby="pvNoteHint">' + esc(note) + '</textarea><p class="meta" id="pvNoteHint">Saved on this device only. Nobody else sees these notes.</p></div>' +
      '<div class="pv-nav"><button type="button" class="btn ghost" data-pvstep="-1"' + (i ? '' : ' disabled') + '>Back</button><button type="button" class="btn" data-pvstep="1"' + (i < qs.length - 1 ? '' : ' disabled') + '>Next</button></div>');
  } else if (pvTxt(x.prepBring)) out += sec('bring', 'What to bring up', '<p>' + esc(pvTxt(x.prepBring)) + '</p>');
  /* 5. questions to ask */
  var asks = pvAsks(x);
  if (asks.length) out += sec('ask', 'Questions to ask them', '<ul class="pv-list">' + asks.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>');
  if (!has && !(dd != null && dd < 0)) out += '<div class="card pv-wait"><p class="psub" style="margin:0">' + esc(prepWait(x)) + ' Sherif will add it here.</p></div>';
  /* 6. after the interview */
  if (dd != null && dd < 0) {
    var opts = [['Heard back', 'Heard back'], ['Interview scheduled', 'Another round'], ['Employer declined', 'Employer declined'], ['Offer', 'Offer']];
    var j = x.jobId ? jobById(x.jobId) : null, ty = j ? jobDocs(j).filter(function (d) { return /thank/i.test(d.name || '') && safeUrl(d.link); })[0] : null;
    var nv = P.next != null ? P.next : String(x.myNotes || '');
    top += sec('after', 'How did it go?',
      '<p class="psub">Tell us where it stands. It updates your Applied tab.</p><div class="pv-st" role="group" aria-labelledby="pv-after">' + opts.map(function (o) { return '<button type="button" data-pvst="' + esc(o[0]) + '" aria-pressed="' + (x.status === o[0]) + '">' + esc(o[1]) + '</button>'; }).join('') + '</div>' +
      '<p class="pv-msg" id="pvMsg" role="status">' + esc(P.msg || '') + (P.re ? reauthBtn() : '') + '</p>' +
      '<p><b>Send a thank-you note</b> to ' + (pvTxt(x.contact) ? esc(pvTxt(x.contact)) : 'the people you met') + ' within a day. Thank them and mention one thing you talked about.</p>' +
      (ty ? '<p><a class="kbtn" href="' + esc(safeUrl(ty.link)) + '" target="_blank" rel="noopener noreferrer">' + IC.ext + 'Your thank-you note</a></p>' : '') +
      '<label for="pvNext">Notes for next time</label><textarea id="pvNext" maxlength="2000" aria-describedby="pvNextHint">' + esc(nv) + '</textarea><p class="meta" id="pvNextHint">Saved with this application as your notes, so Sherif sees them too.</p>' +
      '<div class="pv-row"><button type="button" class="btn" data-pvsave' + (P.busy === 'notes' ? ' disabled' : '') + '>' + (P.busy === 'notes' ? 'Saving…' : 'Save notes') + '</button></div>', 'pv-after');
  }
  var back = from === 'apps' ? 'Back to Applied' : from === 'docs' ? 'Back to Documents' : 'Back to your jobs';
  return shell(from, 'Interview prep: ' + esc(coOr(x)), esc(pvTxt(x.role))) + '<div class="pband" aria-hidden="true"></div>' +
    '<main class="pmain flow pv" data-pv="' + esc(x.id) + '"><div class="fl-top"><button class="fl-back" data-prepclose>' + IC.chev + back + '</button>' + (S.reauthMsg ? '<div class="warn">Your sign-in has expired.' + reauthBtn() + '</div>' : '') + '</div>' + top + out + '</main>' + tabbar(from);
}
function pvSave(x, body, ok) {
  S.pv.busy = body.myNotes != null ? 'notes' : 'status'; S.pv.msg = 'Saving…'; S.pv.re = false; render();
  saveApp(Object.assign({ id: x.id }, body), function (r) {
    if (!S.pv) return; S.pv.busy = false;
    if (r.ok) { Object.keys(body).forEach(function (k) { x[k] = body[k]; }); S.pv.msg = ok; }
    else { S.pv.re = r.error === 'expired'; S.pv.msg = r.error === 'expired' ? 'Your sign-in has expired. Sign in again, then save it.' : 'Sorry, that didn\'t save. Please check your connection and try again.'; }
    render(); if (r.ok && body.status === 'Offer') { celebrate(); toast('An offer! Congratulations.'); }
  });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button'); if (!b || !S.data || S.view !== 'prep' || !S.pv) return; var d = b.dataset, x = appById(S.pv.id);
  if (d.prepclose != null) { closePrep(); return; }
  if (!x) return;
  if (d.pvshow != null) { S.pv.show = !S.pv.show; render(); return; }
  if (d.pvstep) { var n = pvQs(x).length, i = Math.min(Math.max((S.pv.i || 0) + Number(d.pvstep), 0), n - 1); S.pv.i = i; S.pv.show = false; if ((d.pvstep === '1' && i >= n - 1) || (d.pvstep === '-1' && i <= 0)) S.focusTo = '#pvQ'; render(); return; }
  if (d.pvst) { if (S.pv.busy) return; if (x.status === d.pvst) { S.pv.msg = 'Already saved as ' + d.pvst + '.'; render(); return; }
    pvSave(x, { status: d.pvst }, d.pvst === 'Interview scheduled' ? 'Saved. When you have the date, add it with Update on your Applied tab.' : d.pvst === 'Offer' ? 'Saved. Congratulations!' : 'Saved. Your Applied tab is up to date.'); return; }
  if (d.pvsave != null) { if (S.pv.busy) return; var el = document.getElementById('pvNext'), v = el ? el.value.trim() : '';
    if (v === pvTxt(x.myNotes)) { S.pv.msg = 'Nothing changed.'; S.pv.next = null; render(); return; }
    S.pv.next = null; pvSave(x, { myNotes: v }, 'Notes saved.'); return; }
});
document.addEventListener('input', function (e) {
  var t = e.target; if (!t || !S.pv || S.view !== 'prep') return;
  if (t.id === 'pvNext') { S.pv.next = t.value; return; }
  if (t.dataset && t.dataset.pvnote) { var x = appById(t.dataset.pvnote), q = x && pvQs(x)[S.pv.i || 0]; if (q) pvSaveNote(x.id, q.q, t.value); }
});
/* ---- document change history ---- */
function docHistHtml(x) {
  var log = pvTxt(x.changeLog); if (!log) return '';
  var v = parseFloat(String(x.version == null ? '' : x.version).trim().replace(/^v(ersion)?\s*/i, ''));
  if (!(v > 1) && !pvTxt(x.changed)) return '';
  var items = log.split(/\r?\n/).map(pvTxt).filter(String).slice(0, 30).map(function (l) { var m = l.match(/^(\d{4}-\d\d-\d\d)\s*:\s*(.*)$/); return m ? '<li><span class="dh-d">' + esc(fmtY(m[1])) + (m[2] ? ':' : '') + '</span> ' + esc(m[2]) + '</li>' : '<li>' + esc(l) + '</li>'; });
  var key = String(x.id), n = items.length;
  return '<details class="dhist" data-dhist="' + esc(key) + '"' + (S.dhOpen && S.dhOpen[key] ? ' open' : '') + '><summary>History <span class="dh-n">(' + n + (n === 1 ? ' earlier change' : ' earlier changes') + ')</span></summary><ul>' + items.join('') + '</ul></details>';
}
document.addEventListener('toggle', function (e) { var t = e.target; if (t && t.dataset && t.dataset.dhist != null) { S.dhOpen = S.dhOpen || {}; S.dhOpen[t.dataset.dhist] = t.open; } }, true);
/* =================== END ROUND 6a =================== */
</script>
