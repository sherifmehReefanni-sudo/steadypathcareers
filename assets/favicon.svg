    <!-- center dashes shrinking toward horizon -->
    <circle cx="400" cy="760" r="14" fill="#C9A227"/>
    <circle cx="400" cy="690" r="12" fill="#C9A227"/>
    <circle cx="400" cy="625" r="10" fill="#C9A227"/>
    <circle cx="400" cy="565" r="8" fill="#C9A227"/>
    <circle cx="400" cy="510" r="6.5" fill="#C9A227"/>
    <circle cx="400" cy="460" r="5" fill="#C9A227"/>
    <circle cx="400" cy="415" r="4" fill="#C9A227"/>
    <circle cx="400" cy="375" r="3" fill="#C9A227"/>
  </g>
  <!-- horizon line -->
  <path d="M 120 330 L 383 330 M 417 330 L 680 330" stroke="#C9A227" stroke-width="12" stroke-linecap="round"/>
</svg>
