<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><clipPath id="c"><circle cx="400" cy="400" r="400"/></clipPath></defs>
